# AIIairs 사이트 공개: aiiairs/ 폴더를 GitHub Pages 로 올린다.
# 놀코(datecourse/)도 같은 Pages 의 /nolco/ 아래에 함께 올린다. (Pages 는 저장소마다 하나라서)
# 처음 한 번 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 바꿔야 한다.
# 주소: https://<계정>.github.io/<저장소>/
name: AIIairs 사이트 공개

on:
  # 사이트 파일을 고쳐 기본 브랜치에 올렸을 때
  push:
    paths:
      - "aiiairs/**"
      - "datecourse/**"
      - ".github/workflows/aiiairs-pages.yml"
  # 일정 수집·놀코 동네·코스 확인이 끝났을 때. 로봇의 커밋은 push 이벤트를 깨우지 않아서 따로 연결한다.
  workflow_run:
    workflows: ["AIIairs 일정 수집", "놀코 동네 확인", "놀코 코스 위치 확인", "놀코 관광공사 코스 수집"]
    types: [completed]
  # Actions 탭에서 바로 실행
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aiiairs-pages
  cancel-in-progress: true

jobs:
  deploy:
    # 기본 브랜치에서만, 그리고 수집이 실패했을 때는 올리지 않는다
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 일 때도 수집이 막 올린 최신 일정을 받도록 기본 브랜치 끝을 받는다
          ref: ${{ github.event.repository.default_branch }}

      - name: 공개할 파일만 모으기
        run: |
          mkdir -p _site
          cp aiiairs/index.html aiiairs/robots.txt aiiairs/sitemap.xml _site/
          cp -r aiiairs/img aiiairs/data _site/
          # 운영용 파일(직접 입력 원본 표)은 올리지 않는다
          rm -f _site/data/manual.csv
          # 놀코: https://<계정>.github.io/<저장소>/nolco/
          mkdir -p _site/nolco
          cp datecourse/index.html datecourse/manifest.webmanifest datecourse/sw.js datecourse/icon.svg _site/nolco/
          cp -r datecourse/data _site/nolco/
          touch _site/.nojekyll

      # 공식 포스터: 저장소에 쌓지 않고 사이트를 올릴 때 받는다. 받아 둔 것은 Actions 캐시에 두고 새것만 받는다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 포스터 줄이기 도구 설치
        run: pip install --quiet Pillow

      - name: 받아 둔 포스터 꺼내기
        uses: actions/cache/restore@v4
        with:
          path: .poster-cache
          key: posters-${{ github.run_id }}
          restore-keys: posters-

      - name: 포스터 준비
        run: |
          python aiiairs/scripts/collect.py --posters-only --out _site/data/fairs.json --posters-dir .poster-cache
          mkdir -p _site/posters
          cp -r .poster-cache/. _site/posters/
          ls _site/posters | wc -l
          du -sh _site

      # 놀코 '이번 주말': 위 일정(포스터 경로까지 단 것)을 읽어 놀코 전용 events.json 을 만든다. 실패해도 사이트는 올린다
      - name: 놀코 이번 주말 데이터
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python datecourse/scripts/build_events.py --fairs _site/data/fairs.json --out _site/nolco/data/events.json || echo "::warning::놀코 이번 주말 데이터를 만들지 못했어요"

      - name: 받은 포스터 남겨 두기
        uses: actions/cache/save@v4
        with:
          path: .poster-cache
          key: posters-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
