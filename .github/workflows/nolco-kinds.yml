# 놀코 놀거리 종류 거르기 점검: 실제 카카오 검색 결과에 앱 규칙을 적용해 로그로 보여 준다 (파일은 안 바꿈)
name: 놀코 종류 점검

on:
  push:
    paths:
      - "datecourse/scripts/check_kinds.py"
      - ".github/workflows/nolco-kinds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 종류 점검
        run: python datecourse/scripts/check_kinds.py | tee kinds.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kinds
          path: kinds.txt
