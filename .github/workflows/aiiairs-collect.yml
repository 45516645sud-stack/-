# AIIairs 일정 자동 수집: 매일 새벽 KOPIS 등에서 일정을 모아 aiiairs/data/fairs.json 을 갱신한다.
# 저장소 Settings → Secrets and variables → Actions 에 KOPIS_API_KEY (선택: DATA_GO_KR_KEY) 를 넣어야 한다.
# 포스터는 여기서 받지 않는다. 사이트를 올릴 때(aiiairs-pages.yml) 받는다. 저장소가 무거워지지 않게.
name: AIIairs 일정 수집

on:
  schedule:
    - cron: "43 20 * * *"   # 매일 05:43 KST (UTC 20:43)
  workflow_dispatch:         # Actions 탭에서 바로 실행

permissions:
  contents: write

concurrency:
  group: aiiairs-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 처음 한 번은 전국 공연 상세를 모두 물어봐서 오래 걸린다. 그다음부터는 새 공연만 묻는다.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집기 테스트
        run: python -m unittest aiiairs/scripts/test_collect.py

      # 어제까지 물어본 공연·공연장 정보 (저장소에는 넣지 않고 Actions 캐시에 둔다)
      - name: 기억해 둔 공연 정보 꺼내기
        uses: actions/cache/restore@v4
        with:
          path: aiiairs/.cache
          key: kopis-cache-${{ github.run_id }}
          restore-keys: kopis-cache-

      - name: 일정 수집
        env:
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python aiiairs/scripts/collect.py --no-posters

      # 공연 홍보 영상(유튜브) 찾기: 관리자 페이지에서 '맞아요'를 누른 것만 사이트에 나온다. 실패해도 일정은 올린다
      - name: 홍보 영상 찾기
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python -m unittest aiiairs/scripts/test_find_videos.py
          python aiiairs/scripts/find_videos.py || echo "::warning::홍보 영상을 찾지 못했어요"

      - name: 공연 정보 기억해 두기
        if: always() && hashFiles('aiiairs/.cache/kopis.json') != ''
        uses: actions/cache/save@v4
        with:
          path: aiiairs/.cache
          key: kopis-cache-${{ github.run_id }}

      - name: 바뀐 일정 커밋
        run: |
          if [ -z "$(git status --porcelain -- aiiairs/data/fairs.json aiiairs/data/videos.json)" ]; then
            echo "바뀐 일정 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aiiairs/data/fairs.json
          [ -f aiiairs/data/videos.json ] && git add aiiairs/data/videos.json
          git commit -m "AIIairs: 일정 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          # 수집하는 20분 사이에 다른 작업(놀코 등)이 먼저 올리면 push 가 거절된다.
          # 우리는 fairs.json 한 파일만 바꾸므로, 최신을 받아 그 위에 다시 얹고 몇 번 더 시도한다.
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1
