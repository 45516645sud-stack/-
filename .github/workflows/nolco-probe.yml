# 임시 점검: 놀코 서버가 승인된 팝업을 주는지 본다 (확인 뒤 지움)
name: 놀코 임시 점검
on:
  push:
    branches: [claude/gracious-ptolemy-msmifr]
    paths: [".github/workflows/nolco-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          E=https://hzomhheyccapnzuwtzxh.supabase.co/functions/v1/bright-action
          O="Origin: https://45516645sud-stack.github.io"
          curl -s -i -H "$O" "$E?mode=popups" | head -c 3000; echo
          curl -s -o /dev/null -w "pages index: %{http_code}\n" https://45516645sud-stack.github.io/-/nolco/index.html
          curl -s https://45516645sud-stack.github.io/-/nolco/index.html | grep -c "loadPopups" || true
          curl -s https://45516645sud-stack.github.io/-/nolco/data/popups.json | head -c 300; echo
