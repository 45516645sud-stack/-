# 놀코 '우리 동네' 늘리기: 후보 동네를 실제 카카오 지도로 확인해서 놀거리가 충분한 곳만 local.json 에 넣는다.
# 후보는 datecourse/data/hood_candidates.json. 놀코 서버 함수(Supabase)를 거쳐 카카오에 묻는다.
name: 놀코 동네 확인

on:
  push:
    paths:
      - "datecourse/data/hood_candidates.json"
      - "datecourse/scripts/verify_hoods.py"
      - ".github/workflows/nolco-hoods.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nolco-hoods
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 테스트
        run: python -m unittest discover -s datecourse/scripts

      - name: 동네 확인
        run: python datecourse/scripts/verify_hoods.py

      - name: 바뀐 동네 커밋
        run: |
          if [ -z "$(git status --porcelain -- datecourse/data/local.json datecourse/data/hood_rejected.json)" ]; then
            echo "바뀐 동네 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datecourse/data/local.json datecourse/data/hood_rejected.json
          git commit -m "놀코: 우리 동네 자동 확인 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git push
