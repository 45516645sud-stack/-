# 놀코 코스 장소 점검: 매주 코스 정류장(가게류)이 아직 카카오 지도에 있는지 보고 data/course_check.json 을 갱신한다.
name: 놀코 코스 장소 점검

on:
  schedule:
    - cron: "37 19 * * 3"   # 매주 목요일 새벽 4시 37분 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nolco-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 점검
        run: python datecourse/scripts/check_courses.py
      - name: 바뀐 결과 커밋
        run: |
          if [ -z "$(git status --porcelain -- datecourse/data/course_check.json)" ]; then
            echo "바뀐 것 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datecourse/data/course_check.json
          git commit -m "놀코: 코스 장소 점검 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
