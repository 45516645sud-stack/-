# 팝업스토어 시험: 최근 블로그·카페 글에서 '지금 하는 팝업'을 얼마나 뽑을 수 있는지 로그로 본다 (앱 파일은 안 바꿈)
name: 놀코 팝업 시험

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 팝업 시험
        run: TZ=Asia/Seoul python datecourse/scripts/check_popups.py | tee popups.txt
      - uses: actions/upload-artifact@v4
        with:
          name: popups
          path: |
            popups.txt
            popups.json
