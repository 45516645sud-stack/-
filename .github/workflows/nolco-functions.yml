# 놀코 서버 함수 자동 배포: supabase/functions/place-photos 를 고치면 Supabase 에 올린다.
# supabase/migrations 의 SQL(리뷰·코스 저장용 표)도 같이 실행한다.
# 대시보드에 처음 올릴 때 붙은 이름(bright-action)을 그대로 쓰기 위해, 같은 코드를 그 이름으로 배포한다.
# 처음 한 번: 저장소 Settings → Secrets and variables → Actions 에 SUPABASE_ACCESS_TOKEN 등록
#   (Supabase 대시보드 → 계정 → Access Tokens 에서 발급)
name: 놀코 서버 함수 배포

on:
  push:
    paths:
      - "supabase/functions/place-photos/**"
      - "supabase/migrations/*_nolco_*.sql"
      - ".github/workflows/nolco-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nolco-functions
  cancel-in-progress: false

jobs:
  deploy:
    # 기본 브랜치에서만 실제 배포
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hzomhheyccapnzuwtzxh
      FUNCTION_NAME: bright-action
    steps:
      - uses: actions/checkout@v4

      - name: 토큰 확인
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN 시크릿이 없어요. 저장소 Settings → Secrets and variables → Actions 에 등록해 주세요."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 테스트
        run: deno test --allow-read supabase/functions/place-photos/

      - name: 저장소 표 만들기 (리뷰·코스)
        # 토큰에 데이터베이스 권한이 없으면 건너뛴다. 그래도 함수가 처음 쓸 때 표를 직접 만든다 (schema.ts)
        continue-on-error: true
        run: |
          # 'if not exists' 라서 여러 번 돌려도 괜찮다. Supabase 관리 API 로 SQL 실행
          for f in supabase/migrations/*_nolco_*.sql; do   # 다른 앱 표는 건드리지 않음
            echo "실행: $f"
            body=$(jq -Rs '{query: .}' "$f")
            code=$(curl -sS -o out.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
            echo "HTTP $code"; head -c 500 out.json; echo
            if [ "$code" -ge 300 ]; then exit 1; fi
          done

      - name: 배포
        run: |
          # 대시보드에 있는 함수 이름으로 같은 코드를 올린다 (주소가 바뀌지 않게)
          rm -rf "supabase/functions/$FUNCTION_NAME"
          cp -r supabase/functions/place-photos "supabase/functions/$FUNCTION_NAME"
          rm -f "supabase/functions/$FUNCTION_NAME/"*_test.ts
          supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: 배포 후 확인 (실제 서버)
        # 앱이 쓰는 요청을 실제 서버에 한 번씩 보내 본다. 투표는 시험용 id(v-000000000t)로만
        env:
          ENDPOINT: https://hzomhheyccapnzuwtzxh.supabase.co/functions/v1/${{ env.FUNCTION_NAME }}
          ORIGIN: https://45516645sud-stack.github.io
        run: |
          sleep 15   # 새 코드가 켜질 때까지
          get() { curl -sS -o out.json -w '%{http_code}' -H "Origin: $ORIGIN" "$ENDPOINT?$1"; }
          post() { curl -sS -o out.json -w '%{http_code}' -H "Origin: $ORIGIN" -H "Content-Type: application/json" -X POST -d "$1" "$ENDPOINT"; }
          fail=0
          check() { echo "$1: HTTP $2 $(head -c 200 out.json)"; if [ "$2" != 200 ] || ! grep -q "$3" out.json; then echo "::error::$1 이(가) 이상해요"; fail=1; fi; }
          check "리뷰 읽기" "$(get 'mode=docs&col=rv')" '"docs"'
          check "팝업" "$(get 'mode=popups')" '"popups"'
          check "닫은 가게" "$(get 'mode=closed')" '"ids"'
          tok=$(openssl rand -hex 16)
          me=$(printf 'nolco:%s' "$tok" | sha256sum | cut -c1-24)
          check "투표 보기" "$(get "mode=vote&id=v-000000000a&me=$me")" '"counts"'
          check "투표하기" "$(post "{\"mode\":\"vote\",\"id\":\"v-000000000a\",\"pick\":1,\"token\":\"$tok\"}")" '"mine":1'
          check "표 바꾸기" "$(post "{\"mode\":\"vote\",\"id\":\"v-000000000a\",\"pick\":0,\"token\":\"$tok\"}")" '"mine":0'
          check "내 표 보기" "$(get "mode=vote&id=v-000000000a&me=$me")" '"mine":0'
          code=$(post '{"mode":"vote","id":"v-000000000a","pick":7,"token":"'"$tok"'"}'); echo "잘못된 번호: HTTP $code"
          if [ "$code" != 400 ]; then echo "::error::잘못된 투표 번호를 막지 않아요"; fail=1; fi
          exit $fail
