# 한 번 쓰고 지우는 작업: 위키미디어 공용에서 놀코 그림용 실제 사진 후보를 받아 작업 브랜치에 올린다.
name: 놀코 사진 후보 모으기

on:
  push:
    branches: ["claude/**"]
    paths:
      - "datecourse/scripts/fetch_photo_candidates.py"
      - ".github/workflows/nolco-photo-candidates.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 후보 받기
        run: python datecourse/scripts/fetch_photo_candidates.py photo_candidates 8
      - name: 브랜치에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo_candidates
          git commit -m "놀코: 사진 후보 (위키미디어 공용, 임시)" || exit 0
          git push
