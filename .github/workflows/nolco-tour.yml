# 놀코 여행 코스 늘리기 (2): 한국관광공사 TourAPI '추천코스'를 모아 data/tour_courses.json 으로 저장한다.
# 저장소 시크릿 DATA_GO_KR_KEY(공공데이터포털 '한국관광공사_국문 관광정보 서비스' 활용 신청한 디코딩 키)가 있어야 돈다.
# 없으면 아무것도 하지 않고 끝난다. AIIairs 와 같은 키를 쓰면 하루 호출 수를 나눠 쓰므로 --max-calls 를 작게 둔다.
name: 놀코 관광공사 코스 수집

on:
  schedule:
    - cron: "17 18 * * 0"   # 매주 월요일 새벽 3시 17분 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nolco-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        run: python datecourse/scripts/collect_tour.py --per-region 5 --max-calls 300

      - name: 바뀐 코스 커밋
        run: |
          if [ ! -f datecourse/data/tour_courses.json ] || [ -z "$(git status --porcelain -- datecourse/data/tour_courses.json)" ]; then
            echo "바뀐 코스 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datecourse/data/tour_courses.json
          git commit -m "놀코: 관광공사 추천코스 수집 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
