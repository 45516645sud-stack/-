<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>놀코 관리</title>
<style>
:root { --ink: #1f1c15; --sub: #6b6455; --line: #ece6d6; --accent: #ff5a3c; --bg: #fff; --fill: #f7f4ec; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 system-ui, sans-serif; }
header { background: var(--accent); color: #fff; padding: 14px 16px; font-weight: 800; font-size: 18px; }
main { max-width: 900px; margin: 0 auto; padding: 16px; }
section { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 0 0 16px; }
h2 { font-size: 16px; margin: 0 0 8px; }
input, select { height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font: inherit; min-width: 0; }
button { height: 36px; border: 0; border-radius: 8px; padding: 0 12px; background: var(--fill); font: inherit; font-weight: 600; cursor: pointer; }
button.primary { background: var(--accent); color: #fff; }
button.danger { background: #fdecec; color: #a12a2a; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note { color: var(--sub); font-size: 12px; }
textarea { width: 100%; font: 12px monospace; height: 64px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.flag { color: #a12a2a; font-weight: 700; }
[hidden] { display: none !important; }
.pp { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 0 0 10px; display: grid; gap: 6px; }
.pp.ok { border-color: #8fd19e; background: #f2fbf4; }
.pp.no { opacity: .55; }
.pp .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pp .grid input, .pp .grid select { width: 100%; }
.pp label { font-size: 11px; color: var(--sub); display: grid; gap: 2px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--fill); }
.badge.sure { background: #e5f4e7; color: #2e7a45; }
.badge.one { background: #fff4c4; color: #8a6200; }
button.ok { background: #2e7a45; color: #fff; }
@media (max-width: 520px) { .pp .grid { grid-template-columns: 1fr; } }
.guide { background: #fff6d2; border-radius: 10px; padding: 10px 12px; }
.guide ol { margin: 6px 0; padding-left: 20px; }
.pp a.note { display: block; color: #2c76b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<header>놀코 관리</header>
<main>
  <section id="login">
    <h2>관리자 로그인</h2>
    <div class="row"><input id="pass" type="password" placeholder="관리자 비밀번호" autocomplete="current-password"><button class="primary" id="go">들어가기</button></div>
    <p class="note" id="msg"></p>
    <details>
      <summary>처음이라면: 관리자 비밀번호 만들기</summary>
      <p class="note">12자 이상으로 정하고 잊지 않게 따로 적어 두세요. 아래 '해시'만 Claude에게 보내면 서버에 등록돼요.
        해시로는 비밀번호를 알아낼 수 없어서 채팅에 보내도 괜찮아요. <b>비밀번호 자체는 보내지 마세요.</b></p>
      <div class="row"><input id="new1" type="password" placeholder="새 비밀번호 (12자 이상)" autocomplete="new-password">
        <input id="new2" type="password" placeholder="한 번 더" autocomplete="new-password"><button id="make">해시 만들기</button></div>
      <textarea id="hashOut" readonly hidden></textarea>
    </details>
  </section>

  <div id="panel" hidden>
    <div class="row tabs" style="margin-bottom:12px">
      <button data-tab="stats" aria-pressed="true">방문 통계</button>
      <button data-tab="pp" aria-pressed="false">팝업 확인</button>
      <button data-tab="rv" aria-pressed="false">리뷰</button>
      <button data-tab="uc" aria-pressed="false">만든 코스</button>
      <button id="out">나가기</button>
    </div>
    <section id="view"></section>
  </div>
</main>
<script>
const ENDPOINT = "https://hzomhheyccapnzuwtzxh.supabase.co/functions/v1/bright-action";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let pass = sessionStorage.getItem("nolco.admin") || "";
let tab = "stats";

async function call(body) {
  const res = await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ mode: "admin", pass, ...body }) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
  return data;
}

async function pbkdf2(p, salt, it) {
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: it }, key, 256);
  return [...new Uint8Array(bits)].map((x) => x.toString(16).padStart(2, "0")).join("");
}
$("make").onclick = async () => {
  const a = $("new1").value, b = $("new2").value;
  if (a.length < 12) return alert("12자 이상으로 정해 주세요");
  if (a !== b) return alert("두 번 쓴 비밀번호가 달라요");
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const saltHex = [...salt].map((x) => x.toString(16).padStart(2, "0")).join("");
  $("hashOut").hidden = false;
  $("hashOut").value = `pbkdf2$150000$${saltHex}$${await pbkdf2(a, salt, 150000)}`;
  $("hashOut").select();
};

async function login() {
  pass = $("pass").value || pass;
  $("msg").textContent = "확인 중…";
  try {
    await call({ action: "stats" });
    sessionStorage.setItem("nolco.admin", pass);
    $("login").hidden = true; $("panel").hidden = false;
    render();
  } catch (e) { $("msg").textContent = e.message; }
}
$("go").onclick = login;
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
$("out").onclick = () => { sessionStorage.removeItem("nolco.admin"); location.reload(); };
document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  render();
});

const EV = { visit: "방문", course: "코스 열기", act: "놀거리 열기", event: "공연·축제 열기", share: "공유", eat: "뭐 먹지 돌리기", near: "지금 근처 열기" };
async function render() {
  const v = $("view");
  v.innerHTML = "<p class='note'>불러오는 중…</p>";
  try {
    if (tab === "stats") {
      const { days, top } = await call({ action: "stats" });
      const byDay = {};
      for (const r of days) (byDay[r.day] ??= {})[r.ev] = r.n;
      v.innerHTML = `<h2>최근 30일</h2>
        <table><tr><th>날짜</th>${Object.values(EV).map((x) => `<th>${x}</th>`).join("")}</tr>
        ${Object.entries(byDay).reverse().map(([d, r]) => `<tr><td>${esc(d)}</td>${Object.keys(EV).map((k) => `<td>${r[k] || 0}</td>`).join("")}</tr>`).join("")}</table>
        <h2 style="margin-top:16px">많이 연 것 (30일)</h2>
        <table><tr><th>종류</th><th>대상</th><th>횟수</th></tr>${top.map((r) => `<tr><td>${esc(EV[r.ev] || r.ev)}</td><td>${esc(r.item)}</td><td>${r.n}</td></tr>`).join("")}</table>`;
      return;
    }
    if (tab === "pp") return renderPopups(v);
    const { docs, reports } = await call({ action: "list" });
    const rep = {};
    for (const r of reports) { const k = `${r.col}/${r.doc_id}/${r.item_id}`; rep[k] = (rep[k] || 0) + 1; }
    const key = tab === "rv" ? "reviews" : "courses";
    const rows = [];
    for (const d of docs.filter((x) => x.col === tab)) {
      for (const [item, it] of Object.entries((d.body && d.body[key]) || {})) rows.push({ doc: d.id, nick: d.body.nick, item, it, n: rep[`${tab}/${d.id}/${item}`] || 0 });
    }
    rows.sort((a, b) => b.n - a.n);
    v.innerHTML = `<h2>${tab === "rv" ? "리뷰" : "만든 코스"} ${rows.length}개</h2><p class="note">신고가 많은 것부터 보여요. 3번 신고되면 앱에서는 이미 숨겨져 있어요.</p>
      <table><tr><th>신고</th><th>닉네임</th><th>${tab === "rv" ? "코스 · 별점 · 내용" : "코스 이름 · 장소"}</th><th></th></tr>
      ${rows.map((r, i) => `<tr><td class="${r.n ? "flag" : ""}">${r.n}</td><td>${esc(r.nick || "누군가")}</td>
        <td>${tab === "rv" ? `${esc(r.item)} · ${esc(r.it.rating)}점<br>${esc(r.it.text)}` : `${esc(r.it.title)}<br><span class="note">${esc((r.it.stops || []).map((s) => s.name).join(" → "))}</span>`}</td>
        <td><button class="danger" data-i="${i}">지우기</button></td></tr>`).join("")}</table>`;
    v.querySelectorAll("button[data-i]").forEach((b) => b.onclick = async () => {
      const r = rows[+b.dataset.i];
      if (!confirm("정말 지울까요? 되돌릴 수 없어요.")) return;
      b.disabled = true;
      try { await call({ action: "delete", col: tab, doc: r.doc, item: r.item }); render(); } catch (e) { alert(e.message); b.disabled = false; }
    });
  } catch (e) { v.innerHTML = `<p class="flag">${esc(e.message)}</p>`; }
}
/* ---------- 팝업 확인: 자동으로 찾은 후보를 보고 승인(앱에 나옴) / 거절 ---------- */
let ppTab = "wait";
const KINDS = { anime: "애니·만화", idol: "아이돌·K-POP", character: "캐릭터", game: "게임", beauty: "뷰티", fashion: "패션", food: "먹거리",
  tech: "테크·가전", movie: "영화·드라마", living: "리빙·문구", art: "전시·체험", sports: "스포츠", pet: "반려동물", etc: "기타" };
const WEEK = "일월화수목금토";
const md = (iso) => { if (!iso) return ""; const d = new Date(iso + "T00:00:00"); return `${d.getMonth() + 1}.${d.getDate()}(${WEEK[d.getDay()]})`; };
async function renderPopups(v) {
  const [cand, { rows, reports }] = await Promise.all([
    fetch("data/popups.json?t=" + Date.now()).then((r) => r.ok ? r.json() : { items: [] }).catch(() => ({ items: [] })),
    call({ action: "popups" }),
  ]);
  const dec = Object.fromEntries(rows.map((r) => [r.id, r]));
  const today = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
  // 후보 중 오늘 끝나거나 이미 끝난 것은 뺀다. 승인한 것은 오늘 후보에 없어도(글이 더 안 올라와도) 끝날 때까지 보인다
  const list = (cand.items || []).filter((c) => c.end > today);
  for (const r of rows) if (!list.some((c) => c.id === r.id) && r.ok && (r.item.end || "") >= today) list.push({ id: r.id, ...r.item, gone: true });
  // 20~30대 대상이 아니라고 자동으로 뺀 것(아이·육아·박람회 등)은 따로
  const stateOf = (c) => dec[c.id] ? (dec[c.id].ok ? "ok" : "no") : c.young === false ? "skip" : "wait";
  const groups = { wait: [], ok: [], no: [], skip: [] };
  for (const c of list) groups[stateOf(c)].push(c);
  groups.ok.sort((a, b) => (a.end || "").localeCompare(b.end || ""));
  const TABS = { wait: "확인할 것", ok: "앱에 나오는 중", no: "틀림으로 뺀 것", skip: "20~30대용 아님" };
  const card = (c) => {
    const d = dec[c.id] && dec[c.id].ok ? { ...c, ...dec[c.id].item } : c;   // 승인할 때 고친 값이 있으면 그걸로
    const st = stateOf(c), n = reports[c.id] || 0;
    const urls = (c.urls || [c.url]).filter(Boolean), titles = c.titles || [];
    const when = d.start ? `${md(d.start)} ~ ${md(d.end)}` : `${md(d.end)}까지`;
    return `<div class="pp ${st}" data-id="${esc(c.id)}">
      <div class="row">
        <span class="badge">${esc(KINDS[d.kind] || "기타")}</span>
        ${c.sure ? `<span class="badge sure">글 ${c.agree}개가 같은 기간</span>` : c.agree ? `<span class="badge one">글 하나뿐 · 틀릴 수 있음</span>` : ""}
        ${(d.start || "") > today ? `<span class="badge">곧 시작</span>` : ""}
        ${c.gone ? `<span class="badge">새 글 없음</span>` : ""}
        ${n ? `<span class="badge flag">'틀렸어요' 신고 ${n}</span>` : ""}
      </div>
      <b style="font-size:17px">${esc(d.name)}</b>
      <div>📅 <b>${esc(when)}</b> &nbsp; 📍 ${esc(d.place || "장소 모름")}</div>
      ${urls.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener" class="note">📝 ${esc(titles[i] || "글 " + (i + 1))}</a>`).join("")}
      <details><summary class="note">✏️ 이름·날짜·장소 고치기</summary>
        <div class="grid" style="margin-top:6px">
          <label>이름<input data-f="name" value="${esc(d.name)}"></label>
          <label>장소<input data-f="place" value="${esc(d.place)}"></label>
          <label>시작 (모르면 비움)<input data-f="start" type="date" value="${esc(d.start)}"></label>
          <label>끝나는 날<input data-f="end" type="date" value="${esc(d.end)}"></label>
          <label>주소<input data-f="address" value="${esc(d.address)}"></label>
          <label>지역<input data-f="region" value="${esc(d.region)}" placeholder="서울, 부산…"></label>
          <label>종류<select data-f="kind">${Object.entries(KINDS).map(([k, n]) => `<option value="${k}" ${k === (d.kind || "etc") ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        </div>
      </details>
      <div class="row">
        ${st !== "ok" ? `<button class="ok" data-act="ok">✅ 셋 다 맞아요 → 앱에 올리기</button>` : `<button class="ok" data-act="ok">고친 내용 저장</button>`}
        ${st !== "no" ? `<button class="danger" data-act="no">❌ 틀려요</button>` : ""}
        ${st !== "wait" ? `<button data-act="reset">확인 전으로</button>` : ""}
      </div>
    </div>`;
  };
  v.innerHTML = `
    <div class="guide">
      <b>확인하는 법</b> (하나에 30초면 돼요)
      <ol>
        <li>📝 <b>글 제목</b>을 눌러 블로그 글을 열어요.</li>
        <li>글에서 세 가지가 카드와 같은지 봐요: <b>① 팝업 이름</b> <b>② 끝나는 날</b> <b>③ 장소</b></li>
        <li>셋 다 맞으면 <b>✅</b>, 팝업이 아니거나 많이 틀리면 <b>❌</b>. 조금만 틀리면 <b>✏️ 고치기</b>로 고친 뒤 ✅</li>
        <li><b>20~30대가 관심 없을 것 같으면 ❌</b>. 종류(애니·캐릭터 등)가 틀리면 ✏️ 고치기에서 바꿔요.</li>
      </ol>
      <p class="note">초록 <b>'글 N개가 같은 기간'</b>은 거의 맞아요. 노란 <b>'글 하나뿐'</b>은 꼭 글을 열어 보세요. 후보는 매일 새벽 새로 찾아요${cand.updated ? ` (마지막: ${esc(cand.updated)})` : ""}.</p>
    </div>
    <div class="row tabs" style="margin:10px 0">${Object.entries(TABS).map(([k, t]) => `<button data-pp="${k}" aria-pressed="${ppTab === k}">${t} ${groups[k].length}</button>`).join("")}</div>
    ${ppTab === "skip" ? `<p class="note">아이·육아, 어르신, 박람회·창업처럼 20~30대가 찾아갈 팝업이 아니라서 자동으로 뺀 것이에요. 잘못 빠진 게 있으면 ✅로 올리면 돼요.</p>` : ""}
    ${ppTab === "ok" ? `<p class="note">앱 '이번 주말 → 팝업'에 나오고 있어요. 끝나는 날이 지나면 저절로 빠지고, '틀렸어요' 신고가 3개 쌓이면 숨겨져요.</p>` : ""}
    ${groups[ppTab].map(card).join("") || `<p class="note">${ppTab === "wait" ? "확인할 후보가 없어요. 내일 새벽에 새로 찾아요." : "없어요"}</p>`}`;
  v.querySelectorAll("[data-pp]").forEach((b) => b.onclick = () => { ppTab = b.dataset.pp; renderPopups(v); });
  v.querySelectorAll(".pp button[data-act]").forEach((b) => b.onclick = async () => {
    const box = b.closest(".pp"), id = box.dataset.id, c = list.find((x) => x.id === id);
    const f = Object.fromEntries([...box.querySelectorAll("[data-f]")].map((i) => [i.dataset.f, i.value.trim()]));
    const popup = { ...f, url: c.url || (c.urls || [])[0] || "", lat: c.lat ?? null, lng: c.lng ?? null };
    const ok = b.dataset.act === "ok" ? true : b.dataset.act === "no" ? false : null;
    if (ok && (!popup.name || !popup.end)) return alert("이름과 끝나는 날은 꼭 있어야 해요");
    b.disabled = true;
    try { await call({ action: "popup_set", id, ok, popup }); renderPopups(v); } catch (e) { alert(e.message); b.disabled = false; }
  });
}

if (pass) login();
</script>
</body>
</html>
