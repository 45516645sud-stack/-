<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어디가지 코스</title>
<meta name="description" content="전국 17개 시·도의 놀거리·데이트 코스를 누구와, 어떤 분위기로, 얼마나 쓸지에 맞춰 추천해 드려요.">
<meta name="theme-color" content="#ffd84d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffcc1a'/%3E%3Cpath d='M32 50s-14-9.5-14-21a8 8 0 0 1 14-5.3A8 8 0 0 1 46 29c0 11.5-14 21-14 21z' fill='%232a2513'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ------------------------------------------------------------------
   어디가지 코스 — 전국 놀거리·데이트 코스 추천
   색은 :root 토큰만 쓰고, 다크 모드는 같은 토큰을 바꿔 끼운다.
------------------------------------------------------------------- */
/* 흰 바탕 위에 노랑을 넓게: 머리말은 노랑 띠, 카드는 흰 종이, 선택된 것은 진한 노랑.
   컴퓨터 설정과 상관없이 늘 밝은 화면으로 열고, 어둡게는 버튼으로만 바꾼다. */
:root {
  --bg: #fffbea;
  --surface: #ffffff;
  --ink: #2a2513;
  --muted: #756c4c;
  --line: #f2e6b6;
  --accent: #ffcc1a;
  --accent-ink: #2a2513;
  --accent-text: #8a5d00;
  --accent-soft: #fff1b8;
  --hero: #ffd84d;
  --chip: #fff4cc;
  --shadow: 0 6px 22px rgba(120, 90, 0, .10);
  --radius: 18px;
  color-scheme: light;
}
:root[data-mode="dark"] {
  --bg: #17150b; --surface: #221f12; --ink: #f8f2da; --muted: #b5aa82;
  --line: #3a341a; --accent: #ffd43b; --accent-ink: #231e08; --accent-text: #ffd43b; --accent-soft: #3b3312;
  --hero: #2f2a10; --chip: #2c2812; --shadow: 0 6px 22px rgba(0, 0, 0, .35); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

/* 머리말 */
header.top {
  padding-top: 22px; padding-bottom: 18px; background: var(--hero);
  box-shadow: 0 0 0 100vmax var(--hero); clip-path: inset(0 -100vmax);
}
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
.brand h1 span { background: var(--surface); color: var(--accent-text); border-radius: 10px; padding: 0 8px; }
.brand p { margin: 6px 0 0; color: var(--ink); opacity: .78; font-size: 13px; }
.icon-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  width: 40px; height: 40px; display: grid; place-items: center; flex: none;
}

.search {
  margin-top: 14px; display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid transparent; border-radius: 14px; padding: 0 12px; box-shadow: var(--shadow);
}
.search input { flex: 1; border: 0; outline: 0; background: transparent; padding: 12px 0; min-width: 0; }

/* 필터 */
.filters { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: 10px; padding-bottom: 6px; }
.row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 6px; }
.row::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid transparent; background: var(--chip); border-radius: 999px;
  padding: 7px 13px; font-size: 14px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip.ghost { background: var(--surface); border-color: var(--line); }
.chip.ghost[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.label { font-size: 12px; color: var(--muted); margin: 4px 0 0; }

.actions { display: flex; gap: 8px; margin: 8px 0 4px; flex-wrap: wrap; }
.btn {
  border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 600;
  background: var(--surface); border: 1px solid var(--line);
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
.btn.small { padding: 7px 11px; font-size: 13px; font-weight: 500; }

.status { color: var(--muted); font-size: 13px; margin: 10px 0; }

/* 코스 카드 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding-bottom: 40px; }
.card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px; display: flex; flex-direction: column; gap: 8px; text-align: left;
  border: 1px solid var(--line); width: 100%;
}
.card:hover { border-color: var(--accent); }
.card { border-top: 4px solid var(--accent); }
.card .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.badge { background: var(--accent-soft); color: var(--accent-text); border-radius: 6px; padding: 2px 7px; font-weight: 600; font-size: 12px; }
.card h3 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.route { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 13px; }
.route span.arrow { color: var(--muted); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 12px; color: var(--muted); }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); }

/* 상세 시트 */
dialog.sheet {
  border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 720px; max-height: 92vh;
  border-radius: 22px 22px 0 0; background: var(--surface); color: var(--ink);
}
@media (min-width: 760px) { dialog.sheet { margin: auto; border-radius: 22px; } }
dialog.sheet::backdrop { background: rgba(20, 10, 14, .45); }
.sheet-in { padding: 18px 16px 28px; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sheet-head h2 { margin: 4px 0; font-size: 21px; letter-spacing: -.02em; }
#map { height: 230px; border-radius: 14px; margin: 12px 0; background: var(--chip); z-index: 0; }
#map.off { display: none; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.fact { background: var(--chip); border-radius: 12px; padding: 10px; text-align: center; }
.fact b { display: block; font-size: 15px; }
.fact small { color: var(--muted); font-size: 12px; }

ol.stops { list-style: none; margin: 8px 0 0; padding: 0; }
ol.stops li { position: relative; padding: 0 0 18px 44px; }
ol.stops li::before {
  content: attr(data-n); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px;
}
ol.stops li:not(:last-child)::after {
  content: ""; position: absolute; left: 14px; top: 32px; bottom: 2px; border-left: 2px dashed var(--line);
}
.stop-name { font-weight: 700; font-size: 16px; }
.stop-kind { color: var(--muted); font-size: 13px; margin-left: 6px; font-weight: 400; }
.stop-tip { margin: 4px 0 8px; color: var(--muted); font-size: 14px; }
.links { display: flex; gap: 6px; flex-wrap: wrap; }
.move { font-size: 12px; color: var(--muted); margin-top: 8px; }
.note { font-size: 12px; color: var(--muted); margin-top: 8px; }

/* 리뷰 */
.reviews { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; }
.reviews h3 { margin: 0 0 8px; font-size: 17px; }
.review-form { display: flex; flex-direction: column; gap: 8px; background: var(--chip); border-radius: 14px; padding: 12px; }
.star-pick { display: flex; align-items: center; gap: 2px; }
.star { border: 0; background: transparent; font-size: 28px; line-height: 1; padding: 2px; color: var(--surface); -webkit-text-stroke: 1px var(--muted); }
.star[aria-pressed="true"] { color: var(--accent); -webkit-text-stroke: 1px var(--accent-text); }
.star-label { font-size: 13px; color: var(--muted); margin-left: 6px; }
textarea, .builder input, .builder select {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  padding: 9px 10px; min-width: 0;
}
textarea { resize: vertical; }
:is(textarea, input, select, button):focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
#reviewList { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.review { border-bottom: 1px dashed var(--line); padding-bottom: 10px; }
.review-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
.review-top .when { color: var(--muted); font-size: 12px; }
.rate { color: var(--accent-text); font-weight: 700; letter-spacing: 1px; }
.review-text { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.maker-box { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; }
.maker { background: var(--accent-soft); color: var(--accent-text); border-radius: 8px; padding: 3px 9px; font-weight: 600; }
.mine-badge { background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 2px 7px; font-weight: 600; font-size: 12px; }

/* 코스 만들기 */
.builder { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.field { display: flex; flex-direction: column; gap: 4px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > span, .field > legend { font-size: 13px; font-weight: 600; color: var(--muted); padding: 0; margin-bottom: 4px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field-row.three { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 480px) { .field-row.three { grid-template-columns: 1fr 1fr; } }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.check { display: inline-flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 999px; padding: 6px 11px; font-size: 14px; cursor: pointer; }
.check input { width: auto; accent-color: var(--accent-text); }
.check:has(input:checked) { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.stop-edit { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.stop-edit li { background: var(--chip); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.stop-edit-row { display: flex; gap: 6px; align-items: center; }
.stop-edit-row > * { min-width: 0; }
.stop-edit-row .s-kind { flex: 1.4; }
.stop-edit-row .s-stay { flex: 1; }
.price-input { position: relative; flex: 1; }
.price-input input { padding-right: 34px; font-variant-numeric: tabular-nums; }
.price-input .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
.price-total { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.price-total b { font-size: 18px; color: var(--accent-text); font-variant-numeric: tabular-nums; }
.price { font-variant-numeric: tabular-nums; }
.stop-edit .num {
  flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
}
.stop-edit .icon-btn { width: 34px; height: 34px; }
.stop-edit .icon-btn:disabled { opacity: .35; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 1000;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.on { opacity: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="top wrap">
  <div class="brand">
    <div>
      <h1>어디가지 <span>코스</span></h1>
      <p>전국 어디서든, 오늘 놀러 갈 코스를 골라 드려요</p>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="화면 밝기 바꾸기" title="밝게/어둡게">🌗</button>
  </div>
  <label class="search">
    <span aria-hidden="true">🔍</span>
    <span class="sr">코스 검색</span>
    <input id="q" type="search" placeholder="예: 야경, 강릉, 비 오는 날, 빵" autocomplete="off">
  </label>
</header>

<section class="filters wrap" aria-label="코스 고르기">
  <div class="row" id="regionRow" role="group" aria-label="지역"></div>
  <div class="row" id="withRow" role="group" aria-label="누구와"></div>
  <div class="row" id="tagRow" role="group" aria-label="분위기"></div>
  <div class="row" id="moreRow" role="group" aria-label="예산과 시간"></div>
  <div class="actions">
    <button class="btn primary" id="randomBtn">🎲 아무 코스나 골라줘</button>
    <button class="btn" id="nearBtn">📍 내 주변 코스</button>
    <button class="btn" id="favBtn" aria-pressed="false">♡ 찜한 코스</button>
    <button class="btn" id="userOnlyBtn" aria-pressed="false">👥 모두가 만든 코스</button>
    <button class="btn primary" id="makeBtn">✏️ 코스 만들기</button>
  </div>
</section>

<main class="wrap">
  <p class="status" id="status" aria-live="polite">코스를 불러오는 중…</p>
  <div class="grid" id="grid"></div>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-in" id="sheetBody"></div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";

/* ---------- 고정 값 ---------- */
const REGIONS = ["서울", "부산", "대구", "인천", "광주", "대전", "울산", "세종", "경기", "강원", "충북", "충남", "전북", "전남", "경북", "경남", "제주"];
const WITH = { date: "💑 연인", friends: "👯 친구", family: "👨‍👩‍👧 가족", solo: "🚶 혼자" };
const TAGS = ["야경", "바다", "카페", "맛집", "산책", "전통", "실내", "비오는날", "액티비티", "노을", "자연", "시장"];
const BUDGET = { 0: "₩0 무료", 1: "₩ 가볍게", 2: "₩₩ 적당히", 3: "₩₩₩ 넉넉히" };
const BUDGET_HINT = { 0: "돈 안 드는 코스", 1: "1인 3만 원 안팎", 2: "1인 3~7만 원", 3: "1인 7만 원 이상" };
const KIND = {
  walk: "🚶 산책", cafe: "☕ 카페", food: "🍜 먹거리", view: "🌄 전망", culture: "🏛️ 문화",
  activity: "🎢 놀거리", shop: "🛍️ 쇼핑", beach: "🏖️ 바다", night: "🌙 밤", stay: "🛏️ 숙소",
};
const STORE = { fav: "datecourse.fav", theme: "datecourse.theme.v2" };

/* ---------- 상태 ---------- */
const state = {
  courses: [], base: [],
  region: "", who: "", tags: new Set(), budget: null, short: false,
  q: "", favOnly: false, userOnly: false, here: null,
};
let fav = new Set(load(STORE.fav, []));

/* ---------- 브라우저 저장소 (막혀 있어도 앱은 돌아가게) ---------- */
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* 사생활 보호 모드 등 */ }
}

/* ---------- 데이터 ---------- */
async function fetchJson(url) {
  try {
    const res = await fetch(url, { cache: "no-cache" });
    return res.ok ? await res.json() : null;
  } catch { return null; }
}

async function loadCourses() {
  // courses.json: 직접 고른 기본 코스 / tour_courses.json: 한국관광공사 추천코스 수집 결과(있을 때만)
  const [base, tour] = await Promise.all([fetchJson("data/courses.json"), fetchJson("data/tour_courses.json")]);
  const seen = new Set();
  const list = [];
  for (const data of [base, tour]) {
    for (const c of (data && data.courses) || []) {
      if (!c || !c.id || seen.has(c.id) || !Array.isArray(c.stops) || !c.stops.length) continue;
      seen.add(c.id);
      list.push(c);
    }
  }
  return list;
}

/* ---------- 거리 ---------- */
function km(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const hasPos = (s) => Number.isFinite(s.lat) && Number.isFinite(s.lng);
function startOf(c) { return c.stops.find(hasPos) || null; }
function distanceTo(c) {
  const s = state.here && startOf(c);
  return s ? km(state.here, s) : Infinity;
}

/* ---------- 거르기 ---------- */
function haystack(c) {
  return [c.title, c.summary, c.region, c.area, ...(c.tags || []), ...c.stops.map((s) => s.name + " " + (s.tip || ""))]
    .join(" ").toLowerCase().replace(/\s+/g, "");
}
function matches(c) {
  if (state.favOnly && !fav.has(c.id)) return false;
  if (state.userOnly && c.source !== "user") return false;
  if (state.region && c.region !== state.region) return false;
  if (state.who && !(c.with || []).includes(state.who)) return false;
  if (state.budget !== null) {
    // 무료는 돈이 안 드는 코스만, 나머지는 그 예산 안에 드는 코스 모두
    const b = BUDGET[c.budget] ? c.budget : 2;
    if (state.budget === 0 ? !(b === 0 || totalPrice(c) === 0) : b > state.budget) return false;
  }
  if (state.short && (c.hours || 0) > 4) return false;
  for (const t of state.tags) if (!(c.tags || []).includes(t)) return false;
  if (state.q) {
    const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    const hay = haystack(c);
    if (!words.every((w) => hay.includes(w))) return false;
  }
  return true;
}
function visible() {
  const list = state.courses.filter(matches);
  if (state.here) list.sort((a, b) => distanceTo(a) - distanceTo(b));
  return list;
}

/* ---------- 그리기 ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

function chip(label, pressed, onClick, extra = "") {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip " + extra;
  b.textContent = label;
  b.setAttribute("aria-pressed", String(pressed));
  b.addEventListener("click", onClick);
  return b;
}

function renderFilters() {
  const region = $("regionRow");
  region.replaceChildren(
    chip("🇰🇷 전국", !state.region, () => { state.region = ""; update(); }),
    ...REGIONS.map((r) => chip(r, state.region === r, () => { state.region = state.region === r ? "" : r; update(); })),
  );
  $("withRow").replaceChildren(
    ...Object.entries(WITH).map(([k, v]) => chip(v, state.who === k, () => { state.who = state.who === k ? "" : k; update(); })),
  );
  $("tagRow").replaceChildren(
    ...TAGS.map((t) => chip("#" + t, state.tags.has(t), () => { state.tags.has(t) ? state.tags.delete(t) : state.tags.add(t); update(); }, "ghost")),
  );
  $("moreRow").replaceChildren(
    ...Object.entries(BUDGET).map(([k, v]) => chip(v, state.budget === +k, () => { state.budget = state.budget === +k ? null : +k; update(); }, "ghost")),
    chip("⏱ 반나절(4시간 이하)", state.short, () => { state.short = !state.short; update(); }, "ghost"),
  );
  $("favBtn").setAttribute("aria-pressed", String(state.favOnly));
  $("favBtn").textContent = (state.favOnly ? "♥" : "♡") + " 찜한 코스" + (fav.size ? ` ${fav.size}` : "");
  $("nearBtn").textContent = state.here ? "📍 가까운 순 끄기" : "📍 내 주변 코스";
  $("userOnlyBtn").setAttribute("aria-pressed", String(state.userOnly));
  $("userOnlyBtn").textContent = (state.userOnly ? "✓ " : "👥 ") + "모두가 만든 코스" + (shared.userCourses.length ? ` ${shared.userCourses.length}` : "");
}

function routeLine(c) {
  return c.stops.map((s) => `<span>${esc(s.name)}</span>`).join('<span class="arrow">→</span>');
}

function card(c) {
  const d = distanceTo(c);
  const rate = ratingOf(c.id);
  const b = document.createElement("button");
  b.type = "button";
  b.className = "card";
  b.innerHTML = `
    <div class="meta">
      <span class="badge">${esc(c.region)}${c.area ? " · " + esc(c.area) : ""}</span>
      <span>${c.hours ? "약 " + c.hours + "시간" : ""}</span>
      <span>${esc(BUDGET[c.budget] || "")}</span>
      ${totalPrice(c) !== null ? `<span class="price">💰 1인 ${won(totalPrice(c))}</span>` : ""}
      ${Number.isFinite(d) ? `<span>📍 ${d < 1 ? "1km 안" : Math.round(d) + "km"}</span>` : ""}
      ${rate ? `<span class="rate">★ ${rate.avg.toFixed(1)} (${rate.n})</span>` : ""}
      ${c.source === "user" ? `<span class="${c.author === shared.me ? "mine-badge" : ""}">${c.author === shared.me ? "내 코스" : "✏️ 직접 만든 코스"}</span>` : ""}
      ${fav.has(c.id) ? "<span>♥</span>" : ""}
    </div>
    <h3>${esc(c.title)}</h3>
    <p>${esc(c.summary)}</p>
    <div class="route">${routeLine(c)}</div>
    <div class="tags">${(c.tags || []).map((t) => `<span class="tag">#${esc(t)}</span>`).join(" ")}</div>`;
  b.addEventListener("click", () => openCourse(c.id));
  return b;
}

function renderList() {
  const list = visible();
  const grid = $("grid");
  if (!state.courses.length) {
    $("status").textContent = "코스를 불러오지 못했어요. 인터넷 연결을 확인하거나 웹 서버로 열어 주세요.";
    grid.replaceChildren();
    return;
  }
  const where = state.region || "전국";
  $("status").textContent = list.length
    ? `${where}에서 ${list.length}개 코스를 찾았어요${state.here ? " · 가까운 순" : ""}`
    : "";
  if (!list.length) {
    const div = document.createElement("div");
    div.className = "empty";
    div.innerHTML = state.favOnly && !fav.size
      ? "아직 찜한 코스가 없어요.<br>마음에 드는 코스에서 ♡를 눌러 보세요."
      : state.userOnly && !shared.userCourses.length
        ? "아직 아무도 코스를 만들지 않았어요.<br>✏️ 코스 만들기로 첫 코스를 올려 보세요."
        : "조건에 맞는 코스가 없어요.<br>필터를 하나씩 풀어 보세요.";
    grid.replaceChildren(div);
    return;
  }
  grid.replaceChildren(...list.map(card));
}

function update() { renderFilters(); renderList(); }

/* ---------- 지도 링크 (키 없이 쓰는 공개 주소) ---------- */
function mapLinks(s) {
  const name = encodeURIComponent(s.name);
  const links = [];
  if (hasPos(s)) {
    links.push(["카카오맵", `https://map.kakao.com/link/map/${name},${s.lat},${s.lng}`]);
    links.push(["길찾기", `https://map.kakao.com/link/to/${name},${s.lat},${s.lng}`]);
  } else {
    links.push(["카카오맵", `https://map.kakao.com/link/search/${name}`]);
  }
  links.push(["네이버지도", `https://map.naver.com/p/search/${name}`]);
  return links.map(([label, href]) => `<a class="btn small" href="${href}" target="_blank" rel="noopener">${label}</a>`).join("");
}

function moveHint(a, b) {
  if (!hasPos(a) || !hasPos(b)) return "";
  const d = km(a, b);
  const how = d < 1.2 ? `걸어서 약 ${Math.max(5, Math.round(d / 4.5 * 60 / 5) * 5)}분` : d < 15 ? "택시·대중교통 추천" : "차로 이동 추천";
  return `<div class="move">↓ 다음 장소까지 ${d < 1 ? Math.round(d * 1000) + "m" : d.toFixed(1) + "km"} · ${how}</div>`;
}

function closeCourse() {
  const sheet = $("sheet");
  if (sheet.open) sheet.close();
}

function drawMap(c) {
  const el = $("map");
  const pts = c.stops.filter(hasPos);
  if (map) { map.remove(); map = null; }
  if (!window.L || !pts.length) { el.classList.add("off"); return; }
  el.classList.remove("off");
  map = L.map(el, { scrollWheelZoom: false, attributionControl: true });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  const latlngs = pts.map((s) => [s.lat, s.lng]);
  c.stops.forEach((s, i) => {
    if (!hasPos(s)) return;
    L.marker([s.lat, s.lng], {
      icon: L.divIcon({
        className: "",
        html: `<div style="width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">${i + 1}</div>`,
        iconSize: [26, 26], iconAnchor: [13, 13],
      }),
    }).addTo(map).bindPopup(esc(s.name));
  });
  if (latlngs.length > 1) {
    L.polyline(latlngs, { color: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#ffcc1a", weight: 3, dashArray: "6 6" }).addTo(map);
    map.fitBounds(latlngs, { padding: [30, 30], maxZoom: 15 });
  } else {
    map.setView(latlngs[0], 14);
  }
  // 시트가 열리는 동안 크기가 바뀌므로 한 번 더 맞춘다
  setTimeout(() => map && map.invalidateSize(), 120);
}

async function share(c) {
  const url = location.href.split("#")[0] + "#c=" + encodeURIComponent(c.id);
  const text = `${c.title}\n${c.stops.map((s, i) => `${i + 1}. ${s.name}`).join("\n")}`;
  try {
    if (navigator.share) { await navigator.share({ title: c.title, text, url }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try {
    await navigator.clipboard.writeText(text + "\n" + url);
    toast("코스 링크를 복사했어요");
  } catch {
    prompt("이 주소를 복사하세요", url);
  }
}

function pickRandom(exceptId) {
  const pool = visible().filter((c) => c.id !== exceptId);
  const list = pool.length ? pool : state.courses.filter((c) => c.id !== exceptId);
  if (!list.length) { toast("고를 코스가 없어요"); return; }
  const c = list[Math.floor(Math.random() * list.length)];
  const wasOpen = $("sheet").open;
  openCourse(c.id, { push: !wasOpen });
  if (wasOpen) history.replaceState({ id: c.id }, "", "#c=" + encodeURIComponent(c.id));
}

/* ---------- 리뷰·직접 만든 코스 (claude.ai 공유 저장소) ----------
   사람마다 문서 하나씩만 쓴다.
     rv/<내 id> = { reviews: { 코스id: { rating, text, at } } }
     uc/<내 id> = { courses: { 코스id: { title, region, stops, … } } }
   모두가 읽고, 자기 문서만 고친다. 앱 주인은 관리용으로 남의 것도 지울 수 있다.
   공유 저장소가 없는 화면(파일로 연 앱 등)에서는 읽기 안내만 보여 준다. */
const shared = {
  db: null, user: null, me: null, owner: false, canWrite: false, ready: false,
  reviewDocs: {},        // 작성자 id → { 코스id: 리뷰 }
  courseDocs: {},        // 작성자 id → { 코스id: 코스 }
  reviews: new Map(),    // 코스id → [{ author, rating, text, at }]
  userCourses: [],
  writing: false,
};
let pendingId = "";      // 공유 주소로 들어왔는데 아직 안 받은 '직접 만든 코스'
let openId = "";         // 지금 열려 있는 코스

// 1인 가격(원): 숫자가 아니거나 비어 있으면 null(안 적음), 0 은 무료
function priceOf(v) {
  if (v === null || v === undefined || v === "") return null;
  const digits = String(v).replace(/[^\d]/g, "");
  if (!digits) return null;
  return Math.min(10000000, Number(digits));
}
const won = (n) => (n === 0 ? "무료" : n.toLocaleString("ko-KR") + "원");
// 장소 가격을 하나라도 적었으면 1인 합계, 아니면 null
function totalPrice(c) {
  const ps = (c.stops || []).map((s) => s.price).filter((p) => Number.isFinite(p));
  return ps.length ? ps.reduce((a, b) => a + b, 0) : null;
}
const str = (v, max) => (typeof v === "string" ? v.trim().slice(0, max) : "");
const int = (v, lo, hi) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : 0; };

// 남이 쓴 데이터는 믿지 않는다: 모양과 길이를 다시 맞춘다
function cleanReview(r) {
  if (!r || typeof r !== "object") return null;
  const rating = int(r.rating, 0, 5);
  if (!rating) return null;
  return { rating, text: str(r.text, 500), at: str(r.at, 40) };
}
function cleanCourse(id, c, author) {
  if (!/^u-[\w-]{4,40}$/.test(id) || !c || typeof c !== "object") return null;
  const stops = (Array.isArray(c.stops) ? c.stops : []).slice(0, 8).map((s) => ({
    name: str(s && s.name, 40), kind: KIND[s && s.kind] ? s.kind : "", stay: int(s && s.stay, 0, 600), tip: str(s && s.tip, 120),
    price: priceOf(s && s.price),
  })).filter((s) => s.name);
  const title = str(c.title, 40);
  if (!title || stops.length < 2) return null;
  return {
    id, author, source: "user",
    region: REGIONS.includes(c.region) ? c.region : "서울",
    area: str(c.area, 20), title, summary: str(c.summary, 120),
    with: (Array.isArray(c.with) ? c.with : []).filter((w) => WITH[w]),
    tags: (Array.isArray(c.tags) ? c.tags : []).filter((t) => TAGS.includes(t)),
    budget: BUDGET[c.budget] ? Number(c.budget) : 2, hours: int(c.hours, 0, 48), best: str(c.best, 10),
    stops, at: str(c.at, 40),
  };
}

function mergeCourses() {
  const seen = new Set(state.base.map((c) => c.id));
  state.courses = [...state.base, ...shared.userCourses.filter((c) => !seen.has(c.id))];
}

async function initShared() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!db) return;
  shared.db = db;
  shared.user = user;
  if (user) {
    const [me, owner, can] = await Promise.all([user.id(), user.isOwner(), user.can("data.write")]);
    shared.me = me;
    shared.owner = owner;
    shared.canWrite = !!me && can !== false;
  }
  shared.ready = true;

  db.collection("rv").limit(1000).onSnapshot((snap) => {
    const docs = {};
    const byCourse = new Map();
    for (const d of snap.docs) {
      const body = d.data() || {};
      const mine = {};
      for (const [cid, raw] of Object.entries(body.reviews || {})) {
        const r = cleanReview(raw);
        if (!r) continue;
        mine[cid] = r;
        if (!byCourse.has(cid)) byCourse.set(cid, []);
        byCourse.get(cid).push({ author: d.id, ...r });
      }
      docs[d.id] = mine;
    }
    for (const list of byCourse.values()) list.sort((a, b) => (b.at || "").localeCompare(a.at || ""));
    shared.reviewDocs = docs;
    shared.reviews = byCourse;
    renderList();
    if (openId) renderReviewList(openId);
  }, () => { /* 끊기면 리뷰 없이 계속 쓴다 */ });

  db.collection("uc").limit(1000).onSnapshot((snap) => {
    const docs = {};
    const list = [];
    for (const d of snap.docs) {
      const mine = {};
      for (const [cid, raw] of Object.entries((d.data() || {}).courses || {})) {
        const c = cleanCourse(cid, raw, d.id);
        if (!c) continue;
        mine[cid] = raw;
        list.push(c);
      }
      docs[d.id] = mine;
    }
    list.sort((a, b) => (b.at || "").localeCompare(a.at || ""));
    shared.courseDocs = docs;
    shared.userCourses = list;
    mergeCourses();
    renderList();
    if (pendingId && state.courses.some((c) => c.id === pendingId)) {
      const id = pendingId;
      pendingId = "";
      openCourse(id, { push: false });
    }
  }, () => {});

  renderFilters();
  if (openId) renderReviewForm(openId);
}

function ratingOf(id) {
  const list = shared.reviews.get(id) || [];
  if (!list.length) return null;
  return { avg: list.reduce((n, r) => n + r.rating, 0) / list.length, n: list.length };
}
const stars = (n) => "★".repeat(n) + "☆".repeat(5 - n);
const day = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("ko-KR"); };

async function names(ids) {
  if (!shared.user || !ids.length) return {};
  try { return await shared.user.profiles(ids); } catch { return {}; }
}

// 한 사람 문서에 쓰기: 앞 쓰기가 끝나야 다음 쓰기
async function writeDoc(path, body) {
  if (shared.writing) return false;
  shared.writing = true;
  try {
    await shared.db.doc(path).set(body);
    return true;
  } catch (e) {
    const code = e && e.code;
    toast(code === "invalid_argument" ? "쓸 권한이 없어요. 앱 주인에게 참여자 권한을 받아 주세요"
      : code === "quota_exceeded" ? "저장 공간이 꽉 찼어요. 앱 주인에게 알려 주세요"
      : "저장하지 못했어요. 잠시 뒤에 다시 해 주세요");
    if (code === "invalid_argument") { shared.canWrite = false; renderFilters(); }
    return false;
  } finally {
    shared.writing = false;
  }
}

/* 리뷰 */
function renderReviewForm(courseId) {
  const box = $("reviewForm");
  if (!box) return;
  if (!shared.db) {
    box.innerHTML = `<p class="note">리뷰는 claude.ai에 공개된 앱 링크에서 남길 수 있어요.</p>`;
    return;
  }
  if (!shared.canWrite) {
    box.innerHTML = `<p class="note">리뷰를 남기려면 앱 주인에게 <b>참여자(Contributor)</b> 권한을 받아야 해요.</p>`;
    return;
  }
  const mine = (shared.reviewDocs[shared.me] || {})[courseId];
  let rating = mine ? mine.rating : 0;
  box.innerHTML = `
    <form class="review-form" id="reviewFormEl">
      <div class="star-pick" role="group" aria-label="별점">
        ${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="star" data-n="${n}" aria-label="별 ${n}개" aria-pressed="false">★</button>`).join("")}
        <span class="star-label" id="starLabel"></span>
      </div>
      <label class="sr" for="reviewText">리뷰 내용</label>
      <textarea id="reviewText" maxlength="500" rows="3" placeholder="다녀온 느낌, 팁, 아쉬운 점을 적어 주세요"></textarea>
      <div class="actions">
        <button class="btn primary" type="submit" id="reviewSave">${mine ? "리뷰 고치기" : "리뷰 남기기"}</button>
        ${mine ? `<button class="btn" type="button" id="reviewDelete">내 리뷰 지우기</button>` : ""}
      </div>
    </form>`;
  $("reviewText").value = mine ? mine.text : "";
  const paint = () => {
    box.querySelectorAll(".star").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.n <= rating)));
    $("starLabel").textContent = rating ? `${rating}점` : "별을 눌러 점수를 골라 주세요";
  };
  box.querySelectorAll(".star").forEach((b) => b.addEventListener("click", () => { rating = +b.dataset.n; paint(); }));
  paint();
  $("reviewFormEl").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!rating) { toast("별점을 먼저 골라 주세요"); return; }
    const reviews = { ...(shared.reviewDocs[shared.me] || {}) };
    reviews[courseId] = { rating, text: $("reviewText").value.trim().slice(0, 500), at: new Date().toISOString() };
    if (await writeDoc("rv/" + shared.me, { reviews })) {
      toast(mine ? "리뷰를 고쳤어요" : "리뷰를 남겼어요");
      shared.reviewDocs[shared.me] = reviews;  // 저장소가 알려 주기 전에도 내 리뷰로 보이게
      renderReviewForm(courseId);
    }
  });
  const del = $("reviewDelete");
  if (del) del.addEventListener("click", () => removeReview(shared.me, courseId));
}

async function removeReview(author, courseId) {
  const reviews = { ...(shared.reviewDocs[author] || {}) };
  delete reviews[courseId];
  if (await writeDoc("rv/" + author, { reviews })) {
    toast("리뷰를 지웠어요");
    shared.reviewDocs[author] = reviews;
    if (author === shared.me) renderReviewForm(courseId);
  }
}

async function renderReviewList(courseId) {
  const box = $("reviewList");
  const head = $("reviewHead");
  if (!box || !head) return;
  const list = shared.reviews.get(courseId) || [];
  const r = ratingOf(courseId);
  head.textContent = r ? `리뷰 ${r.n}개 · 평균 ★ ${r.avg.toFixed(1)}` : "리뷰";
  if (!list.length) {
    box.innerHTML = shared.db ? `<p class="note">아직 리뷰가 없어요. 첫 리뷰를 남겨 주세요.</p>` : "";
    return;
  }
  const ps = await names(list.map((x) => x.author));
  if (openId !== courseId) return;
  box.replaceChildren(...list.map((x) => {
    const li = document.createElement("div");
    li.className = "review";
    const isMe = x.author === shared.me;
    li.innerHTML = `
      <div class="review-top">
        <b class="who"></b><span class="rate">${stars(x.rating)}</span><span class="when">${esc(day(x.at))}</span>
        ${shared.owner && !isMe ? `<button class="btn small" type="button">관리: 지우기</button>` : ""}
      </div>
      <p class="review-text"></p>`;
    li.querySelector(".who").textContent = isMe ? "나" : ((ps[x.author] && ps[x.author].name) || "누군가");
    li.querySelector(".review-text").textContent = x.text;
    const del = li.querySelector("button");
    if (del) del.addEventListener("click", () => removeReview(x.author, courseId));
    return li;
  }));
}

/* 직접 만든 코스: 만든 사람과 고치기·지우기 */
async function renderMaker(c) {
  const box = $("makerBox");
  if (!box || c.source !== "user") return;
  const isMe = c.author === shared.me;
  const ps = isMe ? {} : await names([c.author]);
  if (openId !== c.id) return;
  box.innerHTML = `<span class="maker">✏️ <span class="who"></span></span>
    ${isMe ? `<button class="btn small" type="button" id="editCourse">고치기</button>` : ""}
    ${isMe || shared.owner ? `<button class="btn small" type="button" id="deleteCourse">${isMe ? "지우기" : "관리: 지우기"}</button>` : ""}`;
  box.querySelector(".who").textContent = isMe ? "내가 만든 코스" : `${(ps[c.author] && ps[c.author].name) || "누군가"} 님이 만든 코스`;
  const edit = $("editCourse");
  if (edit) edit.addEventListener("click", () => openBuilder(c.id));
  const del = $("deleteCourse");
  if (del) del.addEventListener("click", () => askDelete(c, del));
}

function askDelete(c, btn) {
  // confirm() 대신 한 번 더 누르게 한다
  if (btn.dataset.sure !== "1") {
    btn.dataset.sure = "1";
    btn.textContent = "정말 지울까요? 한 번 더 누르기";
    return;
  }
  const courses = { ...(shared.courseDocs[c.author] || {}) };
  delete courses[c.id];
  writeDoc("uc/" + c.author, { courses }).then((ok) => {
    if (!ok) return;
    toast("코스를 지웠어요");
    closeCourse();
  });
}

/* 코스 만들기 */
const BEST = ["", "낮", "오후", "저녁", "오후~저녁", "하루", "언제나"];

function openBuilder(editId = "") {
  const sheet = $("sheet");
  openId = "";
  const body = $("sheetBody");
  const head = `
    <div class="sheet-head">
      <div><span class="badge">✏️ 코스 만들기</span><h2 id="sheetTitle">${editId ? "내 코스 고치기" : "나만의 코스 만들기"}</h2></div>
      <button class="icon-btn" id="closeBtn" aria-label="닫기">✕</button>
    </div>`;
  if (!shared.db || !shared.canWrite) {
    body.innerHTML = head + `<p>다른 사람들이 볼 수 있는 코스를 직접 만들어 올리는 곳이에요.</p>
      <p class="note">${!shared.db ? "코스 만들기는 claude.ai에 공개된 앱 링크에서 할 수 있어요."
        : "코스를 올리려면 앱 주인에게 <b>참여자(Contributor)</b> 권한을 받아야 해요."}</p>`;
    $("closeBtn").addEventListener("click", closeCourse);
    if (!sheet.open) sheet.showModal();
    return;
  }
  const old = editId ? cleanCourse(editId, (shared.courseDocs[shared.me] || {})[editId], shared.me) : null;
  const c = old || { region: state.region || "서울", area: "", title: "", summary: "", with: ["date"], tags: [], budget: 2, hours: 4, best: "오후",
    stops: [{ name: "", kind: "walk", stay: 60, tip: "", price: null }, { name: "", kind: "cafe", stay: 60, tip: "", price: null }] };
  body.innerHTML = head + `
    <form class="builder" id="builder" novalidate>
      <label class="field"><span>코스 이름 *</span><input id="f-title" maxlength="40" required placeholder="예: 비 오는 날 성수 실내 데이트"></label>
      <label class="field"><span>한 줄 소개</span><input id="f-summary" maxlength="120" placeholder="어떤 코스인지 한두 문장으로"></label>
      <div class="field-row">
        <label class="field"><span>지역 *</span><select id="f-region">${REGIONS.map((r) => `<option>${r}</option>`).join("")}</select></label>
        <label class="field"><span>동네</span><input id="f-area" maxlength="20" placeholder="예: 성수"></label>
      </div>
      <fieldset class="field"><legend>누구와</legend><div class="checks">
        ${Object.entries(WITH).map(([k, v]) => `<label class="check"><input type="checkbox" name="with" value="${k}" id="f-with-${k}"> ${v}</label>`).join("")}
      </div></fieldset>
      <fieldset class="field"><legend>분위기</legend><div class="checks">
        ${TAGS.map((t, i) => `<label class="check"><input type="checkbox" name="tags" value="${t}" id="f-tag-${i}"> #${t}</label>`).join("")}
      </div></fieldset>
      <div class="field-row three">
        <label class="field"><span>예산</span><select id="f-budget">${Object.entries(BUDGET).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></label>
        <label class="field"><span>걸리는 시간</span><input id="f-hours" type="number" min="1" max="48" inputmode="numeric"></label>
        <label class="field"><span>추천 시간대</span><select id="f-best">${BEST.map((b) => `<option value="${b}">${b || "-"}</option>`).join("")}</select></label>
      </div>
      <fieldset class="field"><legend>장소 (순서대로, 2~6곳) *</legend>
        <ol class="stop-edit" id="stopEdit"></ol>
        <div class="price-total"><span>1인 총 비용</span><b id="priceTotal" aria-live="polite"></b></div>
        <button class="btn small" type="button" id="addStop">+ 장소 추가</button>
      </fieldset>
      <p class="note" id="builderMsg" role="alert"></p>
      <div class="actions">
        <button class="btn primary" type="submit">${old ? "고친 내용 올리기" : "코스 올리기"}</button>
      </div>
      <p class="note">올린 코스는 이 앱을 여는 모든 사람에게 보여요. 장소 이름을 정확히 쓰면 지도 검색이 잘 돼요.</p>
    </form>`;

  $("f-title").value = c.title;
  $("f-summary").value = c.summary;
  $("f-region").value = c.region;
  $("f-area").value = c.area;
  body.querySelectorAll('input[name="with"]').forEach((x) => { x.checked = c.with.includes(x.value); });
  body.querySelectorAll('input[name="tags"]').forEach((x) => { x.checked = c.tags.includes(x.value); });
  $("f-budget").value = String(c.budget);
  $("f-hours").value = c.hours || "";
  $("f-best").value = BEST.includes(c.best) ? c.best : "";

  let stopsDraft = c.stops.map((s) => ({ ...s }));
  const readStops = () => {
    $("stopEdit").querySelectorAll("li").forEach((li, i) => {
      stopsDraft[i] = {
        name: li.querySelector(".s-name").value, kind: li.querySelector(".s-kind").value,
        stay: li.querySelector(".s-stay").value, tip: li.querySelector(".s-tip").value,
        price: priceOf(li.querySelector(".s-price").value),
      };
    });
  };
  const paintStops = () => {
    $("stopEdit").innerHTML = stopsDraft.map((s, i) => `
      <li>
        <div class="stop-edit-row">
          <span class="num">${i + 1}</span>
          <input class="s-name" id="s-name-${i}" maxlength="40" placeholder="장소 이름" aria-label="${i + 1}번째 장소 이름">
          <button class="icon-btn s-del" type="button" aria-label="${i + 1}번째 장소 빼기" ${stopsDraft.length <= 2 ? "disabled" : ""}>✕</button>
        </div>
        <div class="stop-edit-row">
          <select class="s-kind" id="s-kind-${i}" aria-label="종류">${Object.entries(KIND).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
          <input class="s-stay" id="s-stay-${i}" type="number" min="0" max="600" step="10" inputmode="numeric" placeholder="분" aria-label="머무는 시간(분)">
        </div>
        <div class="stop-edit-row">
          <label class="price-input"><span class="sr">${i + 1}번째 장소 1인 가격</span>
            <input class="s-price" id="s-price-${i}" type="text" inputmode="numeric" maxlength="12" placeholder="1인 가격 (무료면 0)">
            <span class="unit" aria-hidden="true">원</span>
          </label>
        </div>
        <input class="s-tip" id="s-tip-${i}" maxlength="120" placeholder="한 줄 팁 (선택)" aria-label="팁">
      </li>`).join("");
    $("stopEdit").querySelectorAll("li").forEach((li, i) => {
      const s = stopsDraft[i];
      li.querySelector(".s-name").value = s.name || "";
      li.querySelector(".s-kind").value = KIND[s.kind] ? s.kind : "walk";
      li.querySelector(".s-stay").value = s.stay || "";
      const price = li.querySelector(".s-price");
      price.value = Number.isFinite(s.price) ? s.price.toLocaleString("ko-KR") : "";
      price.addEventListener("input", () => {
        // 숫자만 남기고 세 자리마다 쉼표
        const digits = price.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "");
        price.value = digits ? Number(digits).toLocaleString("ko-KR") : "";
        readStops();
        paintTotal();
      });
      li.querySelector(".s-tip").value = s.tip || "";
      li.querySelector(".s-del").addEventListener("click", () => { readStops(); stopsDraft.splice(i, 1); paintStops(); });
    });
    $("addStop").disabled = stopsDraft.length >= 6;
    paintTotal();
  };
  const paintTotal = () => {
    const t = totalPrice({ stops: stopsDraft.map((s) => ({ price: priceOf(s.price) })) });
    $("priceTotal").textContent = t === null ? "가격을 적으면 여기서 더해 드려요" : won(t);
  };
  paintStops();
  $("addStop").addEventListener("click", () => {
    readStops();
    if (stopsDraft.length < 6) stopsDraft.push({ name: "", kind: "food", stay: 60, tip: "", price: null });
    paintStops();
    $("s-name-" + (stopsDraft.length - 1)).focus();
  });

  $("builder").addEventListener("submit", async (e) => {
    e.preventDefault();
    readStops();
    const id = old ? old.id : "u-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const raw = {
      title: $("f-title").value, summary: $("f-summary").value, region: $("f-region").value, area: $("f-area").value,
      with: [...body.querySelectorAll('input[name="with"]:checked')].map((x) => x.value),
      tags: [...body.querySelectorAll('input[name="tags"]:checked')].map((x) => x.value),
      budget: +$("f-budget").value, hours: +$("f-hours").value || 0, best: $("f-best").value,
      stops: stopsDraft.map((s) => ({ name: (s.name || "").trim(), kind: s.kind, stay: +s.stay || 0, tip: (s.tip || "").trim(), price: priceOf(s.price) })).filter((s) => s.name),
      at: old ? old.at : new Date().toISOString(),
    };
    const msg = $("builderMsg");
    if (!raw.title.trim()) { msg.textContent = "코스 이름을 적어 주세요."; $("f-title").focus(); return; }
    if (raw.stops.length < 2) { msg.textContent = "장소를 두 곳 이상 적어 주세요."; return; }
    const course = cleanCourse(id, raw, shared.me);
    const { id: _id, author: _author, source: _source, ...stored } = course;
    const courses = { ...(shared.courseDocs[shared.me] || {}), [id]: stored };
    msg.textContent = "";
    if (!(await writeDoc("uc/" + shared.me, { courses }))) return;
    toast(old ? "코스를 고쳤어요" : "코스를 올렸어요");
    // 저장소가 알려 주기 전에도 바로 보이게 먼저 넣어 둔다
    shared.courseDocs[shared.me] = courses;
    shared.userCourses = [course, ...shared.userCourses.filter((x) => x.id !== id)];
    mergeCourses();
    renderList();
    openCourse(id, { push: false });
  });

  $("closeBtn").addEventListener("click", closeCourse);
  if (!sheet.open) sheet.showModal();
  sheet.scrollTop = 0;
  if (map) { map.remove(); map = null; }
}

/* ---------- 내 위치 ---------- */
function toggleNear() {
  if (state.here) { state.here = null; update(); return; }
  if (!navigator.geolocation) { toast("이 브라우저는 위치를 지원하지 않아요"); return; }
  $("nearBtn").textContent = "📍 위치 찾는 중…";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      state.region = "";
      update();
      toast("가까운 코스부터 보여 드려요");
    },
    () => { toast("위치를 가져오지 못했어요. 권한을 확인해 주세요"); update(); },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 },
  );
}

/* ---------- 기타 ---------- */
let toastTimer = 0;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 1800);
}

function applyTheme(theme) {
  if (theme) document.documentElement.setAttribute("data-mode", theme);
  else document.documentElement.removeAttribute("data-mode");
}
function toggleTheme() {
  const dark = document.documentElement.getAttribute("data-mode") === "dark";
  const next = dark ? "light" : "dark";
  applyTheme(next);
  save(STORE.theme, next);
}

function courseFromHash() {
  const m = location.hash.match(/^#c=(.+)$/);
  return m ? decodeURIComponent(m[1]) : "";
}

/* ---------- 시작 ---------- */
applyTheme(load(STORE.theme, ""));
$("themeBtn").addEventListener("click", toggleTheme);
$("randomBtn").addEventListener("click", () => pickRandom(""));
$("nearBtn").addEventListener("click", toggleNear);
$("favBtn").addEventListener("click", () => { state.favOnly = !state.favOnly; update(); });
$("userOnlyBtn").addEventListener("click", () => { state.userOnly = !state.userOnly; update(); });
$("makeBtn").addEventListener("click", () => openBuilder());
let qTimer = 0;
$("q").addEventListener("input", (e) => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = e.target.value.trim(); renderList(); }, 150);
});
$("sheet").addEventListener("close", () => {
  openId = "";
  if (courseFromHash()) history.pushState(null, "", location.pathname + location.search);
});
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeCourse(); });
window.addEventListener("popstate", () => {
  const id = courseFromHash();
  if (id) openCourse(id, { push: false }); else closeCourse();
});

(async () => {
  state.base = await loadCourses();
  mergeCourses();
  update();
  const id = courseFromHash();
  if (id && state.courses.some((c) => c.id === id)) openCourse(id, { push: false });
  else if (id) pendingId = id;
  initShared().catch(() => {});
})();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
