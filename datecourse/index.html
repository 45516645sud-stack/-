/* ------------------------------------------------------------------
   놀코(놀거리 코스) — 전국 놀거리·데이트 코스 추천
   휴대폰 앱처럼: 노란 앱 바 + 지역 탭, 흰 목록, 아래 탭 바.
   색은 :root 토큰만 쓰고, 어둡게는 달 버튼(data-mode)으로만 바꾼다.
------------------------------------------------------------------- */
:root {
  --bg: #ffffff;
  --fill: #f5f3ec;          /* 입력칸·칩 바탕 */
  --ink: #1f1c15;
  --sub: #6d685b;
  --faint: #a6a091;
  --line: #ece8dd;
  --accent: #ffd23f;        /* 앱 노랑 */
  --accent-ink: #1f1c15;
  --accent-text: #8a6200;   /* 흰 바탕 위 노랑 글자 대신 */
  --accent-soft: #fff6d2;
  --star: #f5a700;
  /* 썸네일 색 (분위기별) */
  --t-sea: #e4f1fb;   --t-sea-i: #2c76b8;
  --t-night: #e9e8f8; --t-night-i: #4a45a3;
  --t-green: #e5f4e7; --t-green-i: #2e7a45;
  --t-trad: #f8eae2;  --t-trad-i: #a04e28;
  --t-food: #fdf0da;  --t-food-i: #9b600c;
  --t-fun: #fbe7ef;   --t-fun-i: #b0386b;
  --t-base: #fff4c4;  --t-base-i: #8a6200;
  --shadow-up: 0 -1px 0 var(--line);
  --sheet-shadow: 0 -8px 30px rgba(31, 28, 21, .12);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --tab-h: 62px;
  color-scheme: light;
}
:root[data-mode="dark"] {
  --bg: #15140f; --fill: #24221a; --ink: #f4efe0; --sub: #b0a98f; --faint: #7d775f; --line: #2f2c22;
  --accent: #ffd23f; --accent-ink: #1f1c15; --accent-text: #ffd23f; --accent-soft: #332c12; --star: #ffc93a;
  --t-sea: #172736; --t-sea-i: #7fb9ea; --t-night: #201f36; --t-night-i: #a9a5f0; --t-green: #16291b; --t-green-i: #7fcf96;
  --t-trad: #2e1f17; --t-trad-i: #eaa27d; --t-food: #2e2513; --t-food-i: #f0c06e; --t-fun: #2e1822; --t-fun-i: #f19bbf;
  --t-base: #332c12; --t-base-i: #ffd23f;
  --sheet-shadow: 0 -8px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: inherit; }
svg.i { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.25em; }
svg.i.fillc { fill: currentColor; stroke: none; }
:is(button, a, input, select, textarea):focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 920px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── 앱 바 ── */
.appbar { position: sticky; top: 0; z-index: 30; background: var(--bg); }
.appbar-top { background: var(--accent); }
.appbar-top .wrap { padding-top: 12px; padding-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
.brand-row { display: flex; align-items: center; justify-content: space-between; height: 32px; }
.brand { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.04em; color: var(--accent-ink); }
.brand svg { width: 22px; height: 22px; }
.icon-btn {
  border: 0; background: transparent; width: 36px; height: 36px; border-radius: 10px;
  display: grid; place-items: center; color: inherit; padding: 0;
}
.appbar-top .icon-btn { color: var(--accent-ink); }
.icon-btn:hover { background: rgba(0, 0, 0, .06); }
.search {
  display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px;
  background: #fff; border-radius: 12px; color: #6d685b;
}
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #1f1c15; font-size: 15px; }
.search input::placeholder { color: #a6a091; }
.search input::-webkit-search-cancel-button { filter: grayscale(1); }

/* 여행 코스 / 우리 동네 */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(31, 28, 21, .10); }
.seg button {
  border: 0; height: 36px; border-radius: 9px; background: transparent; font-size: 14px; font-weight: 600; color: #4a4434;
}
.seg button[aria-selected="true"] { background: #fff; color: #1f1c15; font-weight: 800; box-shadow: 0 1px 3px rgba(31, 28, 21, .15); }

/* 동네 고르기 */
.hoods { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 0 0; }
.hoods::-webkit-scrollbar { display: none; }
.local-box { padding: 6px 0 4px; }
.local-box h2 { margin: 10px 0 4px; font-size: 17px; letter-spacing: -0.03em; }
.local-box > p { margin: 0 0 12px; color: var(--sub); font-size: 13px; }
.region-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (min-width: 640px) { .region-pick { grid-template-columns: repeat(6, 1fr); } }
.region-pick button {
  height: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 15px; font-weight: 600; color: var(--ink);
}
.region-pick button.near { grid-column: 1 / -1; background: var(--accent-soft); border-color: transparent; color: var(--accent-text); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 6px; }
@media (min-width: 640px) { .acts { grid-template-columns: repeat(7, 1fr); } }
.act {
  border: 0; background: transparent; padding: 8px 2px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-size: 12px; color: var(--ink); text-align: center; line-height: 1.3; min-width: 0;
}
.act:hover { background: var(--fill); }
.act .ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--fill); color: var(--ink); }
.act .ic svg.i { width: 26px; height: 26px; stroke-width: 1.7; }
.act .ic svg.il { width: 40px; height: 40px; }
.act:hover .ic svg.il, .act:focus-visible .ic svg.il { transform: translateY(-2px) rotate(-4deg); }
.act .ic svg.il { transition: transform .15s ease; }
.act span:last-child { word-break: keep-all; }
.act .ic { position: relative; }
.act.shut .ic svg.il { opacity: .45; filter: grayscale(.5); }
.act .badge { position: absolute; left: 50%; top: -7px; transform: translateX(-50%); white-space: nowrap; font-style: normal;
  font-size: 10px; font-weight: 700; line-height: 1; padding: 3px 6px; border-radius: 999px; background: var(--ink); color: var(--bg); }
.act .badge.alt { background: var(--accent); color: var(--accent-ink); }
.open-line { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; font-size: 13px; background: var(--fill); color: var(--ink); }
.open-line svg.i { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.open-line.closed { background: #fdecec; color: #a12a2a; }
:root[data-mode="dark"] .open-line.closed { background: #3a1d1d; color: #ffb4b4; }
.open-line.maybe { background: var(--accent-soft); color: var(--accent-text); }
.feature { margin: 4px 0 8px; }
.feature-title { display: flex; align-items: center; gap: 6px; font-size: 17px; margin: 14px 0 10px; }
.feature-title svg.i { width: 17px; height: 17px; color: var(--star, #ffc93a); }
.mini-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.mini-row::-webkit-scrollbar { display: none; }
.mini { flex: none; width: 132px; display: flex; flex-direction: column; gap: 4px; border: 0; padding: 0; background: transparent; text-align: left; color: var(--ink); }
.mini .thumb { width: 132px; height: 92px; }
.mini b { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mini small { font-size: 11px; color: var(--sub); display: flex; align-items: center; gap: 3px; }
.mini small svg.i { width: 11px; height: 11px; color: var(--star, #ffc93a); }
.stop-picks { margin: 8px 0 0; }
.stop-picks small { display: block; font-size: 11px; color: var(--faint); margin-bottom: 4px; }
.pick-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pick-chip { display: inline-flex; align-items: baseline; gap: 5px; max-width: 100%; padding: 6px 10px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); text-decoration: none; font-size: 13px; }
.pick-chip b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
.pick-chip span { font-size: 11px; color: var(--sub); }
.link-pill.h24 { background: var(--accent-soft); color: var(--accent-text); font-weight: 700; }

/* 동네 고르기 */
.hood-pick { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 12px; border-radius: 999px;
  border: 0; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 700; white-space: nowrap; }
.hood-pick svg.i { width: 16px; height: 16px; }
.hood-pick .chev { transform: rotate(90deg); }
.hood-search { margin: 12px 0 4px; background: var(--fill); color: var(--sub); }
.hood-search input { color: var(--ink); }
.hood-list { padding-bottom: 12px; }
.hood-group h3 { margin: 18px 0 6px; font-size: 13px; color: var(--sub); font-weight: 700; display: flex; justify-content: space-between; }
.hood-group .opts { display: flex; flex-direction: column; }
.hood-opt { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; width: 100%; padding: 12px 4px; border: 0;
  border-bottom: 1px solid var(--line); background: transparent; text-align: left; color: var(--ink); font-size: 15px; }
.hood-opt small { color: var(--sub); font-size: 12px; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hood-opt[aria-current="true"] { font-weight: 800; color: var(--accent-text); }
.hood-empty { color: var(--sub); text-align: center; padding: 32px 0; }

/* 실제 가게 목록 */
.places { display: flex; flex-direction: column; }
/* 놀거리 화면: 코스로 넘어가는 한 줄 (가게 목록을 가리지 않게 정보 칸 바로 아래) */
.course-link {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; margin: -4px 0 4px;
  padding: 12px 14px; border: 0; border-radius: 12px; background: var(--accent-soft); color: var(--ink); font-size: 14px; text-align: left;
}
.course-link > span:first-child { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.course-link svg.i { width: 18px; height: 18px; color: var(--accent-text); }
.course-link b { color: var(--accent-text); }
.course-link .go { flex: none; display: inline-flex; align-items: center; gap: 2px; font-weight: 700; color: var(--accent-text); }
.course-link .go svg.i { width: 16px; height: 16px; }
.sec-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.map-link { font-size: 13px; color: var(--sub); text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.place { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; }
.place b { font-size: 16px; letter-spacing: -0.02em; }
.place .cat { font-size: 12px; color: var(--sub); }
.place .addr { grid-column: 1 / -1; font-size: 13px; color: var(--sub); }
.place .dist { font-size: 13px; font-weight: 700; color: var(--accent-text); align-self: start; font-variant-numeric: tabular-nums; }
.place .links { grid-column: 1 / -1; margin-top: 6px; }
.place .tel { font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; user-select: all; }
.places-empty { background: var(--fill); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.places-empty p { margin: 0; font-size: 14px; }
.places-empty small { color: var(--sub); font-size: 12px; }
.places-empty .row-actions .btn { flex: 1; }
.places-more { margin-top: 10px; }
.photos { grid-column: 1 / -1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
.photos::-webkit-scrollbar { display: none; }
.photos a { flex: none; width: 96px; height: 96px; border-radius: 10px; overflow: hidden; background: var(--fill); }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-src { font-size: 11px; color: var(--faint); grid-column: 1 / -1; }

/* 지역 탭 */
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; border: 0; background: transparent; padding: 12px 10px 10px; font-size: 15px; color: var(--sub);
  border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tab[aria-pressed="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }

/* 빠른 필터 줄 */
.quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 0; }
.quick::-webkit-scrollbar { display: none; }
/* 옆으로 넘기는 줄: 컴퓨터에서는 휠·끌기·화살표로 넘긴다 */
.hscroll { position: relative; }
.hscroll.dragging > * { cursor: grabbing; user-select: none; }
.hs-btn {
  display: none; position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg);
  box-shadow: 0 2px 8px rgba(31, 28, 21, .12); color: var(--ink); place-items: center; padding: 0;
}
.hs-btn svg.i { width: 18px; height: 18px; }
.hs-btn.prev { left: -6px; }
.hs-btn.next { right: -6px; }
.hs-btn.prev svg { transform: scaleX(-1); }
@media (hover: hover) and (pointer: fine) {
  .hscroll.can-prev .hs-btn.prev, .hscroll.can-next .hs-btn.next { display: grid; }
  .hscroll.can-next::after, .hscroll.can-prev::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40px; pointer-events: none; z-index: 1;
  }
  .hscroll.can-next::after { right: 0; background: linear-gradient(to left, var(--bg), transparent); }
  .hscroll.can-prev::before { left: 0; background: linear-gradient(to right, var(--bg), transparent); }
}
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 12px;
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px; font-size: 14px; color: var(--ink); white-space: nowrap;
}
.chip svg.i { width: 16px; height: 16px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip .count {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ink); color: var(--bg);
  font-size: 11px; font-weight: 700; display: inline-grid; place-items: center;
}
.chip.removable { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); font-weight: 600; }

/* ── 목록 ── */
main.wrap { padding-bottom: calc(var(--tab-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.pick {
  display: flex; align-items: center; gap: 12px; width: 100%; margin: 6px 0 4px; padding: 14px 16px;
  background: var(--accent-soft); border: 0; border-radius: 16px; text-align: left; color: var(--ink);
}
.pick b { display: block; font-size: 15px; }
.pick small { color: var(--sub); font-size: 13px; }
.pick .go {
  margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 14px;
  border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px;
}
.list-head { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 0 4px; }
.list-head h2 { margin: 0; font-size: 17px; letter-spacing: -0.03em; }
.list-head h2 span { color: var(--accent-text); margin-left: 4px; font-variant-numeric: tabular-nums; }
.list-head small { color: var(--sub); font-size: 13px; }
.grid { display: grid; grid-template-columns: 1fr; column-gap: 28px; }
@media (min-width: 760px) { .grid { grid-template-columns: 1fr 1fr; } }

.item {
  display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: start; width: 100%;
  padding: 16px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; color: var(--ink);
}
.thumb {
  width: 84px; height: 84px; border-radius: 14px; position: relative; overflow: hidden;
  display: grid; place-items: center; background: var(--t-base); color: var(--t-base-i);
}
.thumb svg.i { width: 30px; height: 30px; stroke-width: 1.7; }
.thumb svg.il { width: 56px; height: 56px; }
.thumb.sea { background: var(--t-sea); color: var(--t-sea-i); }
.thumb.night { background: var(--t-night); color: var(--t-night-i); }
.thumb.green { background: var(--t-green); color: var(--t-green-i); }
.thumb.trad { background: var(--t-trad); color: var(--t-trad-i); }
.thumb.food { background: var(--t-food); color: var(--t-food-i); }
.thumb.fun { background: var(--t-fun); color: var(--t-fun-i); }
.item-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item-top { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); }
.item-top .heart { margin-left: auto; color: #e5484d; }
.item-top .heart svg.i { width: 15px; height: 15px; }
.mark { font-size: 11px; font-weight: 700; color: var(--accent-text); background: var(--accent-soft); border-radius: 4px; padding: 1px 5px; }
.item h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.35; }
.route { font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.meta .rate { color: var(--ink); font-weight: 700; display: inline-flex; align-items: center; gap: 2px; }
.meta .rate svg.i { width: 14px; height: 14px; color: var(--star); }
.meta .rate small { color: var(--sub); font-weight: 400; font-size: 13px; }
.meta .won { color: var(--ink); font-weight: 600; }
.meta > span + span::before { content: ""; display: inline-block; width: 2px; height: 2px; border-radius: 50%; background: var(--faint); vertical-align: middle; margin-right: 8px; }

textarea, .builder input, .builder select {

}

#reviewList { display: flex; flex-direction: column; margin-top: 6px; }

.maker-box { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 0; font-size: 13px; }
.maker { color: var(--accent-text); font-weight: 700; }

}

// 썸네일: 코스 분위기에 맞춰 색과 그림을 고른다
function themeOf(c) {
  const t = new Set(c.tags || []);
  const has = (...xs) => xs.some((x) => t.has(x));
  if (has("놀이공원")) return ["fun", "spark"];
  if (has("바다")) return ["sea", "wave"];
  if (has("야경")) return ["night", "moon"];
  if (has("전통")) return ["trad", "roof"];
  if (has("자연", "산책", "정원", "호수", "숲")) return ["green", "leaf"];
  if (has("맛집", "카페", "시장", "빵", "야시장")) return ["food", "cup"];
  if (has("액티비티", "놀이공원")) return ["fun", "spark"];
  return ["base", "pin"];
}
const STORE = { fav: "datecourse.fav", theme: "datecourse.theme.v2", mode: "datecourse.mode", hood: "datecourse.hood" };

/* ---------- 상태 ---------- */
const state = {
  courses: [], base: [],
  region: "", who: "", tags: new Set(), budget: null, short: false,
  q: "", favOnly: false, userOnly: false, here: null,
  // 우리 동네: 관광지 대신 노래방·보드게임카페 같은 일상 놀거리
  view: "courses",   // courses: 코스 목록 / weekend: 이번 주말 공연·축제
  mode: "trip", hood: "", local: [], act: "",   // act: '노래방 코스 보기'로 고른 놀거리
};

/* ---------- 브라우저 저장소 (막혀 있어도 앱은 돌아가게) ---------- */
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* 사생활 보호 모드 등 */ }
}

/* ---------- 데이터 ---------- */
async function fetchJson(url) {
  try {
    const res = await fetch(url, { cache: "no-cache" });
    return res.ok ? await res.json() : null;
  } catch { return null; }
}

async function loadCourses() {
  // courses.json: 직접 고른 기본 코스 / tour_courses.json: 한국관광공사 추천코스 수집 결과(있을 때만)
  const [base, tour] = await Promise.all([fetchJson("data/courses.json"), fetchJson("data/tour_courses.json")]);
  const seen = new Set();
  const list = [];
  for (const data of [base, tour]) {
    for (const c of (data && data.courses) || []) {
      if (!c || !c.id || seen.has(c.id) || !Array.isArray(c.stops) || !c.stops.length) continue;
      seen.add(c.id);
      list.push(c);
    }
  }
  return list;
}

/* ---------- 우리 동네 ----------
   local.json 에는 가게 이름이 없다(자주 바뀌니까). 동네 × 놀거리 종류로 코스를 만들고,
   각 장소는 '동네 + 놀거리' 지도 검색으로 연결한다. */
const LOCAL = { acts: {}, actList: [], hoods: {}, tpls: [] };

async function loadLocal() {
  const data = await fetchJson("data/local.json");
  if (!data || !Array.isArray(data.activities)) return [];
  LOCAL.actList = data.activities;
  LOCAL.acts = Object.fromEntries(data.activities.map((a) => [a.id, a]));
  LOCAL.hoods = data.hoods || {};
  LOCAL.tpls = data.templates || [];
  const out = [];
  for (const [region, hs] of Object.entries(LOCAL.hoods)) {
    for (const h of hs) {
      for (const t of LOCAL.tpls) {
        out.push({
          id: `l-${t.id}-${h.id}`, source: "local", region, area: h.name, hoodId: h.id,
          title: t.title.replace("{hood}", h.name), summary: t.summary,
          with: t.with, tags: t.tags, budget: t.budget, hours: t.hours, best: t.best, details: t.details,
          stops: t.stops.map((id) => {
            const a = LOCAL.acts[id];
            return { act: a.id, name: a.name, kind: a.kind, stay: a.stay, tip: a.tip, q: `${h.q} ${a.kw}`, priceNote: a.price, icon: a.icon, group: a.group || a.id };
          }),
        });
      }
    }
  }
  return out;
}
const hoodsOf = (region) => LOCAL.hoods[region] || [];
// 동네가 속한 시·군·구: 데이터의 city, 없으면 시·군·구청 주변 후보는 설명에서, 아니면 이름 첫 단어
function cityOf(h) {
  if (h.city) return h.city;
  const m = /^(\S+?[시군구]) 중심가$/.exec(h.desc || "");
  if (m) return m[1];
  if (!h.name.includes(" ")) return "그 밖의 동네";
  // '포항 양덕동' → 같은 지역 시·군·구청 후보 중 '포항시'
  const first = h.name.split(" ")[0];
  const region = Object.keys(LOCAL.hoods).find((r) => LOCAL.hoods[r].includes(h));
  const known = (LOCAL.hoods[region] || []).map((x) => (/^(\S+?[시군구]) 중심가$/.exec(x.desc || "") || [])[1]).filter(Boolean);
  return known.find((c) => c.startsWith(first) && c.length === first.length + 1) || first;
}
// 노래방·코인노래방처럼 비슷한 놀거리는 같은 묶음으로 본다
const actGroup = (id) => (LOCAL.acts[id] || {}).group || id;
const hoodById = (id) => Object.values(LOCAL.hoods).flat().find((h) => h.id === id) || null;
const allCourses = () => [...state.courses, ...state.local];
const findCourse = (id) => state.courses.find((c) => c.id === id) || state.local.find((c) => c.id === id);
const browsing = () => !state.favOnly && !state.userOnly;   // 홈 탭(찜·모두의 코스가 아닐 때)

function setRegion(r) {
  state.region = r;
  if (state.mode === "local") {
    const hs = hoodsOf(r);
    if (!hs.some((h) => h.id === state.hood)) state.hood = hs.length ? hs[0].id : "";
    save(STORE.hood, state.hood);
  }
}
function setMode(m) {
  state.view = "courses";
  state.mode = m;
  state.act = "";
  save(STORE.mode, m);
  state.favOnly = false;
  state.userOnly = false;
  if (m === "local") setRegion(state.region);
  update();
  window.scrollTo({ top: 0 });
}

/* ---------- 거리 ---------- */
function km(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const hasPos = (s) => Number.isFinite(s.lat) && Number.isFinite(s.lng);
function startOf(c) { return c.stops.find(hasPos) || null; }
function distanceTo(c) {
  const s = state.here && startOf(c);
  return s ? km(state.here, s) : Infinity;
}

/* ---------- 거르기 ---------- */
function haystack(c) {
  return [c.title, c.summary, c.region, c.area, ...(c.tags || []), ...c.stops.map((s) => s.name + " " + (s.tip || "")),
    ...(c.details || []).map((d) => d.text)]
    .join(" ").toLowerCase().replace(/\s+/g, "");
}
function matches(c) {
  if (state.favOnly && !fav.has(c.id)) return false;
  if (state.userOnly && c.source !== "user") return false;
  if (state.region && c.region !== state.region) return false;
  if (state.who && !(c.with || []).includes(state.who)) return false;
  if (state.budget !== null) {
    // 무료는 돈이 안 드는 코스만, 나머지는 그 예산 안에 드는 코스 모두
    const b = BUDGET[c.budget] ? c.budget : 2;
    if (state.budget === 0 ? !(b === 0 || totalPrice(c) === 0) : b > state.budget) return false;
  }
  if (state.short && (c.hours || 0) > 4) return false;
  for (const t of state.tags) if (!(c.tags || []).includes(t)) return false;
  if (state.q) {
    const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    const hay = haystack(c);
    if (!words.every((w) => hay.includes(w))) return false;
  }
  return true;
}
function visible() {
  let pool;
  if (state.favOnly) pool = allCourses();
  else if (state.userOnly) pool = state.courses;
  else if (state.mode === "local") {
    // 동네를 고르기 전에는 비워 두고, 검색할 땐 고른 지역 전체에서 찾는다
    if (!state.region && !state.q) return [];
    pool = state.local.filter((c) => state.q || !state.hood || c.hoodId === state.hood);
  } else pool = state.courses;
  let list = pool.filter(matches);
  if (state.mode === "local" && state.act && browsing()) {
    // 고른 놀거리가 들어간 코스만, 그 놀거리가 앞에 나오는 코스부터
    const g = actGroup(state.act);
    const at = (c) => c.stops.findIndex((s) => s.group === g);
    list = list.filter((c) => at(c) >= 0).sort((a, b) => at(a) - at(b));
  }
  if (state.here) list.sort((a, b) => distanceTo(a) - distanceTo(b));
  return list;
}

/* ---------- 그리기 ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

function chip(label, pressed, onClick, extra = "") {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip " + extra;
  b.textContent = label;
  b.setAttribute("aria-pressed", String(pressed));
  b.addEventListener("click", onClick);
  return b;
}

function filterCount() {

}

  );
  // 빠른 줄: 필터 · 내 주변 · 켜 둔 조건(누르면 해제)

  const on = [];
  const off = (label, fn) => {

  };
  if (state.who) off(WITH[state.who], () => { state.who = ""; });

  if (state.short) off("반나절", () => { state.short = false; });
  if (local && state.act && LOCAL.acts[state.act]) off(LOCAL.acts[state.act].name + " 코스", () => { state.act = ""; });
  for (const t of state.tags) off("#" + t, () => state.tags.delete(t));
  $("quickRow").replaceChildren(fb, near, ...on);

  // 여행 / 우리 동네
  $("modeTrip").setAttribute("aria-selected", String(state.mode === "trip"));

    const sameCity = cur ? hoodsOf(state.region).filter((h) => cityOf(h) === cityOf(cur)) : [];
    hoodRow.replaceChildren(pick, ...sameCity.map((h) =>
      chip(h.name, state.hood === h.id, () => { state.hood = h.id; save(STORE.hood, h.id); update(); })));

  }

  );

    ...TAGS.map((t) => chip("#" + t, state.tags.has(t), () => { state.tags.has(t) ? state.tags.delete(t) : state.tags.add(t); update(); })),
  );
  $("moreRow").replaceChildren(
    ...Object.entries(BUDGET).map(([k, v]) => chip(v, state.budget === +k, () => { state.budget = state.budget === +k ? null : +k; update(); })),
  );
  $("timeRow").replaceChildren(chip("반나절 (4시간 이하)", state.short, () => { state.short = !state.short; update(); }));
  $("filterApply").textContent = `코스 ${visible().length}개 보기`;

  // 아래 탭 바

    $(id).innerHTML = `${icon(ic, active && ic === "heart" ? "fillc" : "")}<span>${label}</span>${badge ? `<span class="badge-n">${badge}</span>` : ""}`;
    if (active) $(id).setAttribute("aria-current", "page"); else $(id).removeAttribute("aria-current");
  };
  tab("tabHome", "home", "홈", mode === "home");
  tab("weekendBtn", "calendar", "이번 주말", mode === "weekend");
  tab("userOnlyBtn", "users", "모두의 코스", mode === "user");
  tab("favBtn", "heart", "찜", mode === "fav", fav.size);
  $("makeBtn").innerHTML = `<span class="plus">${icon("plus")}</span><span>만들기</span>`;
}

// 받침이 있으면 a(이·을), 없으면 b(가·를)
function josa(word, a, b) {
  const code = word.charCodeAt(word.length - 1) - 0xac00;
  return code >= 0 && code <= 11171 && code % 28 ? a : b;
}

/* 보통 영업시간: 카카오 검색은 가게별 영업시간을 주지 않아서, 놀거리마다 흔한 시간대로 '지금 열었을까'를 알려 준다.
   open: [여는 시, 닫는 시] (24 넘으면 다음 날 새벽), open24: 24시간 하는 곳이 흔함 */
const hh = (h) => { const x = h % 24; return x === 0 ? (h >= 24 ? "자정" : "0시") : x < 12 ? (h >= 24 ? "새벽 " : "오전 ") + x + "시" : x === 12 ? "낮 12시" : "오후 " + (x - 12) + "시"; };
function openText(a) {
  if (!Array.isArray(a.open)) return "";
  const [o, c] = a.open;
  return c - o >= 24 ? "보통 24시간" : `보통 ${hh(o)}~${hh(c)}`;
}
// 지금 열었을 가능성: "open" | "maybe" (24시간 곳만) | "closed" | ""
function openNow(a, now = new Date()) {
  if (!Array.isArray(a.open)) return "";
  const [o, c] = a.open;
  if (c - o >= 24) return "open";
  const h = now.getHours() + now.getMinutes() / 60;
  const inside = (h >= o && h < c) || (h + 24 >= o && h + 24 < c);
  return inside ? "open" : a.open24 ? "maybe" : "closed";
}
const OPEN_MSG = { open: "지금은 대부분 영업 중이에요", maybe: "지금은 24시간 하는 곳만 열었을 수 있어요", closed: "지금은 대부분 문을 닫았을 시간이에요" };

/* 실제 가게 찾기: 카카오 지도 키가 있으면 앱 안에서 검색, 없으면 지도 앱으로 연결 */
let kakaoReady = null;
function kakaoPlaces() {
  if (kakaoReady) return kakaoReady;
  const key = (document.querySelector('meta[name="kakao-js-key"]') || {}).content || "";
  kakaoReady = !key ? Promise.resolve(null) : new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&libraries=services&autoload=false`;
    s.onload = () => window.kakao.maps.load(() => resolve(new window.kakao.maps.services.Places()));
    s.onerror = () => resolve(null);
    document.head.appendChild(s);
    setTimeout(() => resolve(null), 8000);
  });
  return kakaoReady;
}

/* 놀거리 종류에 맞는 가게인지: 카카오 분류(예: 음식점 > 카페 > 테마카페 > 보드카페)와 가게 이름으로 가려낸다.
   match 중 하나는 있어야 하고, not 중 하나라도 있으면 뺀다 (예: 보드게임카페에 호프, 디저트 카페에 보드게임카페).
   '코인+노래'처럼 +로 이으면 둘 다 있어야 한다. 규칙은 data/local.json, 실제 카카오 결과로 scripts/check_kinds.py 로 점검 */
function fitsAct(a, p) {
  if (!a || !Array.isArray(a.match)) return true;
  const text = `${p.category_name || ""} ${p.place_name || ""}`.toLowerCase();
  const has = (w) => String(w).toLowerCase().split("+").every((part) => text.includes(part));
  return a.match.some(has) && !(a.not || []).some(has);
}

/* 놀코 서버로 가게 찾기: 동네 가운데에서 2km 안을 놀거리 이름 몇 가지로 찾아 합친다
   (동네 이름을 붙이면 결과가 확 줄어서 붙이지 않음). 종류 규칙으로 거른 가까운 순 목록, 서버가 없거나 실패하면 null */
const placeCache = new Map();
function serverPlaces(a, keyword, center) {
  const endpoint = photoEndpoint();
  if (!endpoint) return Promise.resolve(null);
  const key = `${a ? a.id : keyword}|${center.lat.toFixed(4)},${center.lng.toFixed(4)}`;
  if (!placeCache.has(key)) placeCache.set(key, (async () => {
    const kws = (a && Array.isArray(a.kws) && a.kws.length) ? a.kws : [keyword];
    const get = async (page, kw = kws[0]) => {
      const res = await fetch(`${endpoint}?mode=places&q=${encodeURIComponent(kw)}&lat=${center.lat}&lng=${center.lng}&radius=2000&size=15&page=${page}`);
      if (!res.ok) return null;
      const data = await res.json();
      return (Array.isArray(data.places) ? data.places : []).map((p) => ({
        place_name: p.name, category_name: p.path || p.category, road_address_name: p.address, address_name: p.address,
        phone: p.phone, place_url: p.url, distance: p.distance === null || p.distance === undefined ? "" : String(p.distance), x: p.x, y: p.y,
      }));
    };
    const pick = (list) => {
      const seen = new Set();
      return list.filter((p) => {
        const k = `${p.place_name}|${p.road_address_name || p.address_name}`;
        if (seen.has(k) || !fitsAct(a, p)) return false;
        seen.add(k);
        return true;
      });
    };
    try {
      const pages = await Promise.all(kws.map((kw) => get(1, kw).catch(() => null)));
      if (pages.every((x) => x === null)) return null;
      let list = pages.flatMap((x) => x || []);
      // 종류가 다른 가게를 빼고 나면 적을 수 있어 한 쪽 더
      if ((pages[0] || []).length >= 15 && pick(list).length < 5) list = list.concat((await get(2).catch(() => null)) || []);
      list.sort((x, y) => (Number(x.distance) || 0) - (Number(y.distance) || 0));
      return pick(list);
    } catch { return null; }
  })().then((r) => { if (r === null) placeCache.delete(key); return r; }));
  return placeCache.get(key);
}

async function showPlaces(keyword, h, q, a) {
  const box = $("placeList");
  const fallback = (why) => {
    if (!$("placeList")) return;
    $("placeList").innerHTML = `<div class="places-empty">
      <p>${why}</p>
      <div class="row-actions">
        <a class="btn primary" href="https://map.kakao.com/link/search/${q}" target="_blank" rel="noopener">카카오맵</a>
        <a class="btn" href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">네이버지도</a>
      </div>
      <small>'${esc(keyword)}'로 검색돼요.</small></div>`;
  };
  const center = state.here || { lat: h.lat, lng: h.lng };
  const pick = (list) => {
    const seen = new Set();
    return list.filter((p) => {
      const k = `${p.place_name}|${p.road_address_name || p.address_name}`;
      if (seen.has(k) || !fitsAct(a, p)) return false;
      seen.add(k);
      return true;
    });
  };
  const empty = () => fallback(`근처에서 '${esc(a ? a.name : keyword)}' 가게를 못 찾았어요. 지도에서 넓게 찾아보세요.`);
  const draw = (list) => {
    list = pick(list);
    if (!list.length) { empty(); return; }
    box.replaceChildren(...list.slice(0, 10).map(placeItem));
    box.insertAdjacentHTML("beforeend", `<a class="btn small places-more" href="https://map.kakao.com/link/search/${q}" target="_blank" rel="noopener">지도에서 더 보기</a>`);
  };

  // 1) 놀코 서버(Supabase)가 카카오 REST 키로 대신 검색: 브라우저 쪽 지도 키 설정과 상관없이 동작
  const list = await serverPlaces(a, keyword, center);
  if (list) {
    if (!$("placeList") || box !== $("placeList")) return;   // 그사이 다른 화면으로 바뀜
    draw(list);
    return;
  }

  // 2) 카카오 지도 JavaScript 키로 브라우저에서 검색
  const places = await kakaoPlaces();
  if (!places) { fallback("지도 앱에서 지금 영업 중인 가게를 바로 볼 수 있어요."); return; }
  places.keywordSearch((a && a.kws && a.kws[0]) || keyword, (data, status) => {
    if (!$("placeList") || box !== $("placeList")) return;   // 그사이 다른 화면으로 바뀜
    const S = window.kakao.maps.services.Status;
    if (status === S.ZERO_RESULT) { empty(); return; }
    if (status !== S.OK) { fallback("가게 목록을 불러오지 못했어요."); return; }
    draw(data);
  }, {
    location: new window.kakao.maps.LatLng(center.lat, center.lng),
    radius: 2000, sort: window.kakao.maps.services.SortBy.DISTANCE, size: 15,
  });
}

function placeItem(p) {
  const el = document.createElement("div");
  el.className = "place";
  const d = Number(p.distance);
  const cat = String(p.category_name || "").split(">").pop().trim();
  el.innerHTML = `<b></b><span class="dist">${Number.isFinite(d) && p.distance !== "" ? (d < 1000 ? d + "m" : (d / 1000).toFixed(1) + "km") : ""}</span>
    <span class="cat"></span><span class="addr"></span>
    <div class="links">
      ${/^https:\/\/place\.map\.kakao\.com\//.test(p.place_url) ? `<a class="link-pill" href="${esc(p.place_url)}" target="_blank" rel="noopener">가게 정보</a>` : ""}
      <a class="link-pill" href="https://map.kakao.com/link/to/${encodeURIComponent(p.place_name)},${Number(p.y)},${Number(p.x)}" target="_blank" rel="noopener">길찾기</a>
      ${p.phone ? `<span class="link-pill tel"></span>` : ""}
      ${/24\s*시|24\s*h|24hour/i.test(p.place_name || "") ? `<span class="link-pill h24">24시간</span>` : ""}
    </div>`;
  el.querySelector("b").textContent = p.place_name || "";
  el.querySelector(".cat").textContent = cat;
  el.querySelector(".addr").textContent = p.road_address_name || p.address_name || "";
  const tel = el.querySelector(".tel");
  if (tel) tel.textContent = p.phone;
  addPhotos(el, p);
  return el;
}

/* 가게 사진: '가게 이름 + 구'로 카카오 블로그·카페 글을 찾아, 가게 이름이 나오는 글의 사진만. 누르면 원래 글로 */
const photoCache = new Map();
function photoEndpoint() {
  return ((document.querySelector('meta[name="nolco-photo-endpoint"]') || {}).content || "").trim();
}
const NEWS_SITE = /뉴스|news|일보|신문|방송|기자|타임스|타임즈|times|press|헤럴드|투데이|매일|경제|KBS|MBC|SBS|YTN|JTBC|MBN|채널A|TV조선|연합|뉴시스|노컷|시청|군청|구청|도청|경찰|소방|정부|공사|위키/i;
const NEWS_URL = /news|v\.daum\.net|\/article|\.go\.kr|\.or\.kr|police|wiki/i;
async function addPhotos(el, p) {
  const endpoint = photoEndpoint();
  if (!endpoint || !p.place_name) return;
  const gu = String(p.address_name || p.road_address_name || "").split(" ")[1] || "";
  const q = `${p.place_name} ${gu}`.trim();
  try {
    if (!photoCache.has(q)) {
      // name: 블로그·카페 글 중 이 가게 이름이 실제로 나오는 글의 사진만 받는다
      photoCache.set(q, fetch(`${endpoint}?q=${encodeURIComponent(q)}&name=${encodeURIComponent(p.place_name)}&size=4`)
        .then((r) => (r.ok ? r.json() : { photos: [] }))
        .then((d) => (Array.isArray(d.photos) ? d.photos : []))
        .catch(() => []));
    }
    // 뉴스·관공서 사진(사건·단속 사진 등)은 가게 이미지를 해칠 수 있어 빼고 블로그·카페 후기 위주로 (서버도 같은 규칙)
    const photos = (await photoCache.get(q)).filter((x) => /^https:\/\//.test(x.thumb) && /^https?:\/\//.test(x.link)
      && !NEWS_SITE.test(x.site || "") && !NEWS_URL.test(x.link));
    if (!photos.length || !el.isConnected) return;
    const strip = document.createElement("div");
    strip.className = "photos";
    for (const ph of photos) {
      const a = document.createElement("a");
      a.href = ph.link;
      a.target = "_blank";
      a.rel = "noopener";
      a.title = ph.site ? `${ph.site}에서 보기` : "사진 출처 보기";
      const img = document.createElement("img");
      img.src = ph.thumb;
      img.alt = `${p.place_name} 사진`;
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.addEventListener("error", () => { a.remove(); if (!strip.children.length) strip.remove(); });
      a.appendChild(img);
      strip.appendChild(a);
    }
    el.querySelector(".links").before(strip);
  } catch { /* 사진 없이 */ }
}

/* 옆으로 넘기는 줄 (지역 탭·동네·빠른 필터): 휠을 옆으로, 마우스로 끌기, 양 끝 화살표 */
function enableHScroll(row) {
  const wrap = document.createElement("div");
  wrap.className = "hscroll";
  row.parentNode.insertBefore(wrap, row);
  wrap.appendChild(row);
  const prev = document.createElement("button");
  const next = document.createElement("button");
  prev.type = next.type = "button";
  prev.className = "hs-btn prev";
  next.className = "hs-btn next";
  prev.setAttribute("aria-label", "왼쪽으로 넘기기");
  next.setAttribute("aria-label", "오른쪽으로 넘기기");
  prev.innerHTML = next.innerHTML = icon("chev");
  wrap.append(prev, next);
  const sync = () => {
    const max = row.scrollWidth - row.clientWidth;
    wrap.classList.toggle("can-prev", row.scrollLeft > 4);
    wrap.classList.toggle("can-next", row.scrollLeft < max - 4);
  };
  const page = (dir) => row.scrollBy({ left: dir * Math.max(160, row.clientWidth * 0.7), behavior: "smooth" });
  prev.addEventListener("click", () => page(-1));
  next.addEventListener("click", () => page(1));
  row.addEventListener("scroll", sync, { passive: true });
  row.addEventListener("wheel", (e) => {
    if (row.scrollWidth <= row.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    const max = row.scrollWidth - row.clientWidth;
    if ((e.deltaY < 0 && row.scrollLeft <= 0) || (e.deltaY > 0 && row.scrollLeft >= max)) return;   // 끝이면 페이지 스크롤
    e.preventDefault();
    row.scrollLeft += e.deltaY;
  }, { passive: false });
  // 마우스로 끌기 (터치는 원래 잘 넘어가서 건드리지 않음)
  let start = null, moved = false;
  row.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    start = { x: e.clientX, left: row.scrollLeft };
    moved = false;
  });
  window.addEventListener("pointermove", (e) => {
    if (!start) return;
    const dx = e.clientX - start.x;
    if (Math.abs(dx) > 5) { moved = true; wrap.classList.add("dragging"); }
    if (moved) row.scrollLeft = start.left - dx;
  });
  window.addEventListener("pointerup", () => { start = null; setTimeout(() => wrap.classList.remove("dragging"), 0); });
  row.addEventListener("click", (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  new MutationObserver(() => requestAnimationFrame(sync)).observe(row, { childList: true });
  new ResizeObserver(sync).observe(row);
  sync();
}

// 골라 둔 칩이 보이게 가운데로
function revealPressed(row) {
  const on = row.querySelector('[aria-pressed="true"]');
  if (!on) return;
  const left = on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2;
  if (on.offsetLeft < row.scrollLeft || on.offsetLeft + on.offsetWidth > row.scrollLeft + row.clientWidth) row.scrollLeft = left;
}

function detailsBox(c) {

/* 다시 올 이유: 리뷰가 좋은 인기 코스, 새로 올라온 코스 (여행 코스 홈), 찜 옮기기 (찜 탭) */

async function moveFav() {
  const url = location.href.split("#")[0] + "#fav=" + [...fav].map(encodeURIComponent).join(",");
  try {
    if (navigator.share) { await navigator.share({ title: "놀코 찜 목록", url }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(url); toast("찜 목록 링크를 복사했어요. 다른 기기에서 열어 주세요"); }
  catch { prompt("이 주소를 다른 기기에서 열어 주세요", url); }
}
// '#fav=a,b' 로 들어오면 찜에 더한다
function favFromHash() {
  const m = location.hash.match(/^#fav=(.*)$/);
  if (!m) return false;
  const ids = m[1].split(",").map((x) => { try { return decodeURIComponent(x); } catch { return ""; } }).filter((x) => /^[\w-]{1,80}$/.test(x)).slice(0, 300);
  const before = fav.size;
  ids.forEach((x) => fav.add(x));
  save(STORE.fav, [...fav]);
  history.replaceState(null, "", location.pathname + location.search);
  toast(fav.size > before ? `찜 ${fav.size - before}개를 옮겨 왔어요` : "이미 찜한 코스들이에요");
  return true;
}


/* ---------- 이번 주말: 공연·축제 (코스와 따로 보는 기능) ----------
   data/events.json 은 사이트를 올릴 때 만든다 (scripts/build_events.py: KOPIS 공연 + 관광공사 축제) */
const WK = { list: null, loading: null, period: "weekend", cat: "", shown: 30 };
const WK_PERIOD = { weekend: "이번 주말", week: "이번 주", month: "한 달" };
function loadEvents() {
  WK.loading ??= fetchJson("data/events.json").then((d) => {
    WK.list = (d && Array.isArray(d.events) ? d.events : []).filter((e) => e && e.title && e.start && e.end && Array.isArray(e.regions));
    $("weekendBtn").hidden = !WK.list.length;   // 데이터가 없는 곳(파일로 연 앱 등)에서는 탭을 숨긴다
    if (!WK.list.length && state.view === "weekend") state.view = "courses";
    renderWeekend();
    renderWeekendEntry();
  });
  return WK.loading;
}
const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function wkRange(period = WK.period, now = new Date()) {
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (period === "week") return [today, addDays(today, 6)];
  if (period === "month") return [today, addDays(today, 30)];
  const dow = today.getDay();   // 일 0 … 토 6. 토·일이면 이번 주말, 아니면 다가오는 토·일
  const sat = dow === 6 ? today : dow === 0 ? today : addDays(today, 6 - dow);
  const sun = dow === 0 ? today : addDays(sat, 1);
  return [sat, sun];
}
const WEEK = "일월화수목금토";
// 10.17(토), 올해가 아니면 27.1.3(일)
const md = (iso) => { const d = new Date(iso + "T00:00:00"); const y = d.getFullYear() !== new Date().getFullYear() ? String(d.getFullYear()).slice(2) + "." : ""; return `${y}${d.getMonth() + 1}.${d.getDate()}(${WEEK[d.getDay()]})`; };
function eventsFor(region = state.region, period = WK.period, cat = WK.cat, q = state.q) {
  if (!WK.list) return [];
  const [from, to] = wkRange(period).map(isoDay);
  const words = (q || "").toLowerCase().split(/\s+/).filter(Boolean);
  return WK.list.filter((e) => e.start <= to && e.end >= from
    && (!region || e.regions.includes(region))
    && (!cat || (cat === "공연" ? e.kind === "show" : e.cat === cat))
    && words.every((w) => `${e.title} ${e.place} ${e.cat} ${e.regions.join(" ")}`.toLowerCase().includes(w)));
}
function eventCard(e) {

  const when = e.long ? `${md(e.end)}까지` : e.start === e.end ? md(e.start) : `${md(e.start)} ~ ${md(e.end)}`;

  $("wkPeriod").replaceChildren(...Object.entries(WK_PERIOD).map(([k, v]) => chip(v, WK.period === k, () => { WK.period = k; WK.shown = 30; renderWeekend(); })));
  $("wkCat").replaceChildren(chip("전체", !WK.cat, () => { WK.cat = ""; WK.shown = 30; renderWeekend(); }),
    ...cats.map(([c, n]) => chip(`${c} ${n}`, WK.cat === c, () => { WK.cat = WK.cat === c ? "" : c; WK.shown = 30; renderWeekend(); })));
  const wl = $("wkList");

  if (now.length > WK.shown) {
    const more = document.createElement("button");
    more.type = "button"; more.className = "btn wk-more"; more.textContent = `더 보기 (${now.length - WK.shown}개 더)`;
    more.addEventListener("click", () => { WK.shown += 30; renderWeekend(); });

  if (always.length && now.length <= WK.shown) {
    const h = document.createElement("h3");
    h.className = "sec-title"; h.textContent = `늘 하는 공연 ${always.length}`;
    wl.append(h, ...always.slice(0, 20).map(eventCard));

/* ---------- 지도 링크 (키 없이 쓰는 공개 주소) ---------- */
function mapLinks(s) {
  const name = encodeURIComponent(s.q || s.name);
  const links = [];
  if (hasPos(s)) {
    links.push(["카카오맵", `https://map.kakao.com/link/map/${name},${s.lat},${s.lng}`]);
    links.push(["길찾기", `https://map.kakao.com/link/to/${name},${s.lat},${s.lng}`]);
  } else {
    links.push(["카카오맵", `https://map.kakao.com/link/search/${name}`]);
  }
  links.push(["네이버지도", `https://map.naver.com/p/search/${name}`]);
  return links.map(([label, href]) => `<a class="link-pill" href="${href}" target="_blank" rel="noopener">${label}</a>`).join("");
}

function moveHint(a, b) {
  if (!hasPos(a) || !hasPos(b)) return "";
  const d = km(a, b);
  const how = d < 1.2 ? `걸어서 약 ${Math.max(5, Math.round(d / 4.5 * 60 / 5) * 5)}분` : d < 15 ? "택시·대중교통 추천" : "차로 이동 추천";
  return `<div class="move">다음 장소까지 ${d < 1 ? Math.round(d * 1000) + "m" : d.toFixed(1) + "km"} · ${how}</div>`;
}

/* ---------- 상세 ---------- */
let map = null;

function openCourse(id, { push = true } = {}) {
  const c = findCourse(id);
  if (!c) return;
  openId = id;
  const stayMin = c.stops.reduce((n, s) => n + (s.stay || 0), 0);
  const total = totalPrice(c);
  const hrs = c.hours ? c.hours + "시간" : stayMin ? "약 " + Math.round(stayMin / 60) + "시간" : "-";
  $("sheetBody").innerHTML = `
    <div class="grabber"></div>
    <div class="sheet-head">
      <div>
        <div class="where">${esc(c.region)}${c.area ? " " + esc(c.area) : ""}</div>
        <h2 id="sheetTitle">${esc(c.title)}</h2>
        <div class="who-line">${(c.with || []).map((w) => esc(WITH[w] || w)).join(" · ")}${c.with && c.with.length ? "에게 추천" : ""}</div>
      </div>
      <button class="icon-btn" id="closeBtn" aria-label="닫기">${icon("close")}</button>
    </div>
    ${c.source === "user" ? `<div class="maker-box" id="makerBox"></div>` : ""}
    ${c.summary ? `<p class="summary">${esc(c.summary)}</p>` : ""}
    <div class="facts">
      <div class="fact"><small>시간</small><b>${hrs}</b></div>
      <div class="fact"><small>${total !== null ? "1인 비용" : "예산"}</small><b class="price">${total !== null ? won(total) : esc(BUDGET[c.budget] || "-")}</b>${total !== null ? `<em>${esc(BUDGET[c.budget] || "")}</em>` : `<em>${esc(BUDGET_HINT[c.budget] || "")}</em>`}</div>
      <div class="fact"><small>추천 시간대</small><b>${esc(c.best || "-")}</b></div>
    </div>
    ${detailsBox(c)}
    <div id="map"></div>
    <h3 class="sec-title">코스 순서</h3>
    <ol class="stops">
      ${c.stops.map((s, i) => `
        <li data-n="${i + 1}">
          <div class="stop-name">${esc(s.name)}</div>
          <span class="stop-kind">${[KIND[s.kind], s.stay ? s.stay + "분" : "", Number.isFinite(s.price) ? won(s.price) : s.priceNote ? "보통 " + s.priceNote : ""].filter(Boolean).map(esc).join(" · ")}</span>
          ${s.tip ? `<p class="stop-tip">${esc(s.tip)}</p>` : ""}
          ${c.source === "local" && s.act ? `<div class="stop-picks" data-act="${esc(s.act)}"><span class="note">근처 실제 가게를 찾는 중…</span></div>` : ""}
          <div class="links">${mapLinks(s)}</div>
          ${i < c.stops.length - 1 ? moveHint(s, c.stops[i + 1]) : ""}
        </li>`).join("")}
    </ol>
    <p class="note">${c.source === "tourapi" ? "출처: 한국관광공사 TourAPI 추천코스. " : c.source === "user" ? "이용자가 직접 만든 코스예요. " : c.source === "local" ? "가게는 동네 가운데에서 가까운 실제 가게예요(카카오 지도 검색). 가격은 대략이고 가게마다 달라요. " : ""}운영 시간·요금·휴무는 바뀔 수 있으니 가기 전에 확인하세요. 거리는 직선거리예요.</p>
    <section class="reviews" aria-labelledby="reviewHead">
      <h3 id="reviewHead">리뷰</h3>
      <div id="reviewForm"></div>

      <button class="btn" id="shareBtn">${icon("copy")}공유</button>
      <button class="btn primary grow" id="againBtn">${icon("shuffle")}다른 코스 뽑기</button>
    </div>`;

  $("closeBtn").addEventListener("click", closeCourse);
  $("favToggle").addEventListener("click", () => {
    fav.has(c.id) ? fav.delete(c.id) : fav.add(c.id);
    save(STORE.fav, [...fav]);
    $("favToggle").setAttribute("aria-pressed", String(fav.has(c.id)));

    toast(fav.has(c.id) ? "찜했어요" : "찜을 취소했어요");

  $("againBtn").addEventListener("click", () => pickRandom(c.id));

  if (!sheet.open) sheet.showModal();
  sheet.scrollTop = 0;
  drawMap(c);
  fillStopPicks(c);

}

// 동네 코스: 단계마다 가까운 실제 가게 3곳 (앞 단계에서 고른 가게는 빼고)
async function fillStopPicks(c) {
  const h = c.source === "local" ? hoodById(c.hoodId) : null;
  const boxes = [...document.querySelectorAll(".stop-picks")];
  if (!h || !boxes.length) return;
  const center = { lat: h.lat, lng: h.lng };
  const used = new Set();
  for (const box of boxes) {
    const a = LOCAL.acts[box.dataset.act];
    const list = a ? await serverPlaces(a, `${h.q} ${a.kw}`, center) : null;
    if (openId !== c.id || !box.isConnected) return;
    const picks = (list || []).filter((p) => !used.has(p.place_name)).slice(0, 3);
    picks.forEach((p) => used.add(p.place_name));
    if (!picks.length) { box.innerHTML = list ? `<span class="note">2km 안에서 못 찾았어요. 아래 지도에서 찾아보세요.</span>` : ""; continue; }
    box.innerHTML = `<small>근처 실제 가게</small><div class="pick-chips"></div>`;
    const chips = box.querySelector(".pick-chips");
    for (const p of picks) {
      const url = /^https:\/\/place\.map\.kakao\.com\//.test(p.place_url) ? p.place_url
        : `https://map.kakao.com/link/to/${encodeURIComponent(p.place_name)},${Number(p.y)},${Number(p.x)}`;
      const el = document.createElement("a");
      el.className = "pick-chip"; el.href = url; el.target = "_blank"; el.rel = "noopener";
      const d = Number(p.distance);
      el.innerHTML = `<b></b><span>${Number.isFinite(d) && p.distance !== "" ? (d < 1000 ? d + "m" : (d / 1000).toFixed(1) + "km") : ""}</span>`;
      el.querySelector("b").textContent = p.place_name;
      chips.appendChild(el);
    }
  }
}

function closeCourse() {
  const sheet = $("sheet");
  if (sheet.open) sheet.close();
}

function drawMap(c) {
  const el = $("map");
  const pts = c.stops.filter(hasPos);
  if (map) { map.remove(); map = null; }
  if (!window.L || !pts.length) { el.classList.add("off"); return; }
  el.classList.remove("off");
  map = L.map(el, { scrollWheelZoom: false, attributionControl: true });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  const latlngs = pts.map((s) => [s.lat, s.lng]);
  c.stops.forEach((s, i) => {
    if (!hasPos(s)) return;
    L.marker([s.lat, s.lng], {
      icon: L.divIcon({
        className: "",
        html: `<div style="width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">${i + 1}</div>`,
        iconSize: [26, 26], iconAnchor: [13, 13],
      }),
    }).addTo(map).bindPopup(esc(s.name));
  });
  if (latlngs.length > 1) {
    L.polyline(latlngs, { color: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#ffcc1a", weight: 3, dashArray: "6 6" }).addTo(map);
    map.fitBounds(latlngs, { padding: [30, 30], maxZoom: 15 });
  } else {
    map.setView(latlngs[0], 14);
  }
  // 시트가 열리는 동안 크기가 바뀌므로 한 번 더 맞춘다
  setTimeout(() => map && map.invalidateSize(), 120);
}

async function share(c) {
  const url = location.href.split("#")[0] + "#c=" + encodeURIComponent(c.id);
  const text = `${c.title}\n${c.stops.map((s, i) => `${i + 1}. ${s.name}`).join("\n")}`;
  try {
    if (navigator.share) { await navigator.share({ title: c.title, text, url }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try {
    await navigator.clipboard.writeText(text + "\n" + url);
    toast("코스 링크를 복사했어요");
  } catch {
    prompt("이 주소를 복사하세요", url);
  }
}

function pickRandom(exceptId) {
  const pool = visible().filter((c) => c.id !== exceptId);
  const list = pool.length ? pool : (state.mode === "local" && state.hood ? state.local.filter((c) => c.hoodId === state.hood) : state.courses).filter((c) => c.id !== exceptId);
  if (!list.length) { toast("고를 코스가 없어요"); return; }
  const c = list[Math.floor(Math.random() * list.length)];
  const wasOpen = $("sheet").open;
  openCourse(c.id, { push: !wasOpen });
  if (wasOpen) history.replaceState({ id: c.id }, "", "#c=" + encodeURIComponent(c.id));
}

/* ---------- 리뷰·직접 만든 코스 (놀코 서버 저장소, claude.ai 미리보기에서는 그 공유 저장소) ----------
   사람마다 문서 하나씩만 쓴다.
     rv/<내 id> = { reviews: { 코스id: { rating, text, at } } }
     uc/<내 id> = { courses: { 코스id: { title, region, stops, … } } }
   모두가 읽고, 자기 문서만 고친다. 앱 주인은 관리용으로 남의 것도 지울 수 있다.
   공유 저장소가 없는 화면(파일로 연 앱 등)에서는 읽기 안내만 보여 준다. */
const shared = {
  db: null, user: null, me: null, owner: false, canWrite: false, ready: false,
  reviewDocs: {},        // 작성자 id → { 코스id: 리뷰 }
  courseDocs: {},        // 작성자 id → { 코스id: 코스 }
  reviews: new Map(),    // 코스id → [{ author, rating, text, at }]
  userCourses: [],
  writing: false,
};
let pendingId = "";      // 공유 주소로 들어왔는데 아직 안 받은 '직접 만든 코스'
let openId = "";         // 지금 열려 있는 코스

// 1인 가격(원): 숫자가 아니거나 비어 있으면 null(안 적음), 0 은 무료
function priceOf(v) {
  if (v === null || v === undefined || v === "") return null;
  const digits = String(v).replace(/[^\d]/g, "");
  if (!digits) return null;
  return Math.min(10000000, Number(digits));
}
const won = (n) => (n === 0 ? "무료" : n.toLocaleString("ko-KR") + "원");
// 장소 가격을 하나라도 적었으면 1인 합계, 아니면 null
function totalPrice(c) {
  const ps = (c.stops || []).map((s) => s.price).filter((p) => Number.isFinite(p));
  return ps.length ? ps.reduce((a, b) => a + b, 0) : null;
}
const str = (v, max) => (typeof v === "string" ? v.trim().slice(0, max) : "");
const int = (v, lo, hi) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : 0; };

// 남이 쓴 데이터는 믿지 않는다: 모양과 길이를 다시 맞춘다
function cleanReview(r) {
  if (!r || typeof r !== "object") return null;
  const rating = int(r.rating, 0, 5);
  if (!rating) return null;
  return { rating, text: str(r.text, 500), at: str(r.at, 40) };
}
function cleanCourse(id, c, author) {
  if (!/^u-[\w-]{4,40}$/.test(id) || !c || typeof c !== "object") return null;
  const stops = (Array.isArray(c.stops) ? c.stops : []).slice(0, 8).map((s) => ({
    name: str(s && s.name, 40), kind: KIND[s && s.kind] ? s.kind : "", stay: int(s && s.stay, 0, 600), tip: str(s && s.tip, 120),
    price: priceOf(s && s.price),
  })).filter((s) => s.name);
  const title = str(c.title, 40);
  if (!title || stops.length < 2) return null;
  return {
    id, author, source: "user",
    region: REGIONS.includes(c.region) ? c.region : "서울",
    area: str(c.area, 20), title, summary: str(c.summary, 120),
    with: (Array.isArray(c.with) ? c.with : []).filter((w) => WITH[w]),
    tags: (Array.isArray(c.tags) ? c.tags : []).filter((t) => TAGS.includes(t)),
    budget: BUDGET[c.budget] ? Number(c.budget) : 2, hours: int(c.hours, 0, 48), best: str(c.best, 10),
    stops, at: str(c.at, 40),
    details: (Array.isArray(c.details) ? c.details : []).slice(0, 3)
      .map((d) => ({ kind: DETAIL[d && d.kind] ? d.kind : "tip", text: str(d && d.text, 100) })).filter((d) => d.text),
  };
}

function mergeCourses() {
  const seen = new Set(state.base.map((c) => c.id));
  state.courses = [...state.base, ...shared.userCourses.filter((c) => !seen.has(c.id))];
}

/* 놀코 서버(Supabase 함수)에 저장: claude.ai 저장소와 같은 모양(collection().onSnapshot, doc().set)으로 감싼다.
   로그인이 없어서 이 브라우저가 만든 비밀 값으로 '내 글'을 알아본다 (다른 기기·브라우저에서는 새 사람). */
const NICK_KEY = "nolco.nick";
const getNick = () => String(load(NICK_KEY, "") || "").slice(0, 12);
async function serverBackend(endpoint) {
  let token = load("nolco.token", "");
  if (!/^[a-f0-9]{32,64}$/.test(token)) {
    token = [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, "0")).join("");
    save("nolco.token", token);
  }
  if (!crypto.subtle) return null;
  const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("nolco:" + token));
  const me = [...new Uint8Array(hash)].map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 24);
  const subs = { rv: [], uc: [] };
  const nicks = {};
  async function pull(col) {
    const res = await fetch(`${endpoint}?mode=docs&col=${col}`, { cache: "no-store" });
    if (!res.ok) throw new Error("docs " + res.status);
    const data = await res.json();
    const docs = (Array.isArray(data.docs) ? data.docs : []).filter((d) => d && typeof d.id === "string");
    for (const d of docs) nicks[d.id] = String((d.data && d.data.nick) || "").slice(0, 12);
    const snap = { docs: docs.map((d) => ({ id: d.id, data: () => d.data })) };
    subs[col].forEach(([ok]) => ok(snap));
  }
  const pullAll = () => Promise.all(Object.keys(subs).map((c) => pull(c).catch((e) => subs[c].forEach(([, bad]) => bad && bad(e)))));
  async function post(msg) {
    const res = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...msg, token }) });
    if (!res.ok) {
      const e = new Error("post " + res.status);
      e.code = res.status === 429 ? "rate_limited" : res.status === 413 ? "quota_exceeded" : "failed";
      throw e;
    }
    return res.json();
  }
  // 1분마다, 화면을 다시 볼 때 새 글 받기
  setInterval(() => { if (document.visibilityState === "visible") pullAll(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pullAll(); });
  const db = {
    server: true,
    collection(col) {
      const q = { limit: () => q, onSnapshot(ok, bad) { (subs[col] || []).push([ok, bad]); pull(col).catch((e) => bad && bad(e)); return () => {}; } };
      return q;
    },
    doc(path) {
      const [col, id] = path.split("/");
      return {
        async set(body) {
          if (id !== me) { const e = new Error("not mine"); e.code = "invalid_argument"; throw e; }
          await post({ mode: "set", col, body: { ...body, nick: getNick() } });
          nicks[me] = getNick();
          pull(col).catch(() => {});
        },
      };
    },
    report: (col, doc, item) => post({ mode: "report", col, doc, item }),
  };
  const user = {
    id: async () => me, isOwner: async () => false, can: async () => true,
    profiles: async (ids) => Object.fromEntries(ids.map((x) => [x, { name: nicks[x] || "" }])),
  };
  return { db, user };
}

async function initShared() {
  let db, user;
  if (window.claude && typeof window.claude.use === "function") {
    [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  } else if (photoEndpoint()) {
    const b = await serverBackend(photoEndpoint()).catch(() => null);
    if (b) ({ db, user } = b);
  }
  if (!db) return;
  shared.db = db;
  shared.user = user;
  if (user) {
    const [me, owner, can] = await Promise.all([user.id(), user.isOwner(), user.can("data.write")]);
    shared.me = me;
    shared.owner = owner;
    shared.canWrite = !!me && can !== false;
  }
  shared.ready = true;

  db.collection("rv").limit(1000).onSnapshot((snap) => {
    const docs = {};
    const byCourse = new Map();
    for (const d of snap.docs) {
      const body = d.data() || {};
      const mine = {};
      for (const [cid, raw] of Object.entries(body.reviews || {})) {
        const r = cleanReview(raw);
        if (!r) continue;
        mine[cid] = r;
        if (!byCourse.has(cid)) byCourse.set(cid, []);
        byCourse.get(cid).push({ author: d.id, ...r });
      }
      docs[d.id] = mine;
    }
    for (const list of byCourse.values()) list.sort((a, b) => (b.at || "").localeCompare(a.at || ""));
    shared.reviewDocs = docs;
    shared.reviews = byCourse;
    renderList();
    if (openId) renderReviewList(openId);
  }, () => { /* 끊기면 리뷰 없이 계속 쓴다 */ });

  db.collection("uc").limit(1000).onSnapshot((snap) => {
    const docs = {};
    const list = [];
    for (const d of snap.docs) {
      const mine = {};
      for (const [cid, raw] of Object.entries((d.data() || {}).courses || {})) {
        const c = cleanCourse(cid, raw, d.id);
        if (!c) continue;
        mine[cid] = raw;
        list.push(c);
      }
      docs[d.id] = mine;
    }
    list.sort((a, b) => (b.at || "").localeCompare(a.at || ""));
    shared.courseDocs = docs;
    shared.userCourses = list;
    mergeCourses();
    renderList();
    if (pendingId && state.courses.some((c) => c.id === pendingId)) {
      const id = pendingId;
      pendingId = "";
      openCourse(id, { push: false });
    }
  }, () => {});

  renderFilters();
  if (openId) renderReviewForm(openId);
}

function ratingOf(id) {
  const list = shared.reviews.get(id) || [];
  if (!list.length) return null;
  return { avg: list.reduce((n, r) => n + r.rating, 0) / list.length, n: list.length };
}
const day = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("ko-KR"); };

async function names(ids) {
  if (!shared.user || !ids.length) return {};
  try { return await shared.user.profiles(ids); } catch { return {}; }
}

// 한 사람 문서에 쓰기: 앞 쓰기가 끝나야 다음 쓰기
async function writeDoc(path, body) {
  if (shared.writing) return false;
  shared.writing = true;
  try {
    await shared.db.doc(path).set(body);
    return true;
  } catch (e) {
    const code = e && e.code;
    toast(code === "invalid_argument" ? (shared.db && shared.db.server ? "내 글만 고칠 수 있어요" : "쓸 권한이 없어요. 앱 주인에게 참여자 권한을 받아 주세요")
      : code === "quota_exceeded" ? "저장 공간이 꽉 찼어요. 앱 주인에게 알려 주세요"
      : code === "rate_limited" ? "너무 자주 저장했어요. 잠시 뒤에 다시 해 주세요"
      : "저장하지 못했어요. 잠시 뒤에 다시 해 주세요");
    if (code === "invalid_argument" && !(shared.db && shared.db.server)) { shared.canWrite = false; renderFilters(); }
    return false;
  } finally {
    shared.writing = false;
  }
}

/* 리뷰 */
function renderReviewForm(courseId) {
  const box = $("reviewForm");
  if (!box) return;
  if (!shared.db) {
    box.innerHTML = `<p class="note">리뷰 저장소에 연결하지 못했어요. 잠시 뒤에 다시 열어 주세요.</p>`;
    return;
  }
  if (!shared.canWrite) {
    box.innerHTML = `<p class="note">리뷰를 남기려면 앱 주인에게 <b>참여자(Contributor)</b> 권한을 받아야 해요.</p>`;
    return;
  }
  const mine = (shared.reviewDocs[shared.me] || {})[courseId];
  let rating = mine ? mine.rating : 0;
  box.innerHTML = `
    <form class="review-form" id="reviewFormEl">
      <div class="star-pick" role="group" aria-label="별점">
        ${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="star" data-n="${n}" aria-label="별 ${n}개" aria-pressed="false">${icon("star")}</button>`).join("")}
        <span class="star-label" id="starLabel"></span>
      </div>
      ${shared.db.server ? `<label class="nick-row"><span>닉네임</span><input id="reviewNick" maxlength="12" placeholder="안 적으면 '누군가'"></label>` : ""}
      <label class="sr" for="reviewText">리뷰 내용</label>
      <textarea id="reviewText" maxlength="500" rows="3" placeholder="다녀온 느낌, 팁, 아쉬운 점을 적어 주세요"></textarea>
      <div class="row-actions">
        <button class="btn primary" type="submit" id="reviewSave">${mine ? "리뷰 고치기" : "리뷰 남기기"}</button>
        ${mine ? `<button class="btn" type="button" id="reviewDelete">내 리뷰 지우기</button>` : ""}
      </div>
    </form>`;
  $("reviewText").value = mine ? mine.text : "";
  if ($("reviewNick")) {
    $("reviewNick").value = getNick();
    $("reviewNick").addEventListener("change", () => save(NICK_KEY, $("reviewNick").value.trim().slice(0, 12)));
  }
  const paint = () => {
    box.querySelectorAll(".star").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.n <= rating)));
    $("starLabel").textContent = rating ? `${rating}점` : "별을 눌러 점수를 골라 주세요";
  };
  box.querySelectorAll(".star").forEach((b) => b.addEventListener("click", () => { rating = +b.dataset.n; paint(); }));
  paint();
  $("reviewFormEl").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!rating) { toast("별점을 먼저 골라 주세요"); return; }
    if ($("reviewNick")) save(NICK_KEY, $("reviewNick").value.trim().slice(0, 12));
    const reviews = { ...(shared.reviewDocs[shared.me] || {}) };
    reviews[courseId] = { rating, text: $("reviewText").value.trim().slice(0, 500), at: new Date().toISOString() };
    if (await writeDoc("rv/" + shared.me, { reviews })) {
      toast(mine ? "리뷰를 고쳤어요" : "리뷰를 남겼어요");
      shared.reviewDocs[shared.me] = reviews;  // 저장소가 알려 주기 전에도 내 리뷰로 보이게
      renderReviewForm(courseId);
    }
  });
  const del = $("reviewDelete");
  if (del) del.addEventListener("click", () => removeReview(shared.me, courseId));
}

async function removeReview(author, courseId) {
  const reviews = { ...(shared.reviewDocs[author] || {}) };
  delete reviews[courseId];
  if (await writeDoc("rv/" + author, { reviews })) {
    toast("리뷰를 지웠어요");
    shared.reviewDocs[author] = reviews;
    if (author === shared.me) renderReviewForm(courseId);
  }
}

async function renderReviewList(courseId) {
  const box = $("reviewList");
  const head = $("reviewHead");
  if (!box || !head) return;
  const list = shared.reviews.get(courseId) || [];
  const r = ratingOf(courseId);
  head.innerHTML = r ? `리뷰 ${r.n} <span class="avg">${icon("star")}${r.avg.toFixed(1)}</span>` : "리뷰";
  if (!list.length) {
    box.innerHTML = shared.db ? `<p class="note">아직 리뷰가 없어요. 첫 리뷰를 남겨 주세요.</p>` : "";
    return;
  }
  const ps = await names(list.map((x) => x.author));
  if (openId !== courseId) return;
  box.replaceChildren(...list.map((x) => {
    const li = document.createElement("div");
    li.className = "review";
    const isMe = x.author === shared.me;
    li.innerHTML = `
      <div class="review-top">
        <b class="who"></b><span class="stars" aria-label="별 ${x.rating}개">${[1, 2, 3, 4, 5].map((n) => icon("star", n > x.rating ? "off" : "")).join("")}</span><span class="when">${esc(day(x.at))}</span>
        ${shared.owner && !isMe ? `<button class="btn small" type="button" data-act="del">관리: 지우기</button>` : ""}
        ${shared.db && shared.db.report && !isMe ? `<button class="btn small ghost" type="button" data-act="report">신고</button>` : ""}
      </div>
      <p class="review-text"></p>`;
    li.querySelector(".who").textContent = isMe ? "나" : ((ps[x.author] && ps[x.author].name) || "누군가");
    li.querySelector(".review-text").textContent = x.text;
    const del = li.querySelector('[data-act="del"]');
    if (del) del.addEventListener("click", () => removeReview(x.author, courseId));
    const rep = li.querySelector('[data-act="report"]');
    if (rep) rep.addEventListener("click", () => reportItem("rv", x.author, courseId, rep));
    return li;
  }));
}

/* 직접 만든 코스: 만든 사람과 고치기·지우기 */
async function renderMaker(c) {
  const box = $("makerBox");
  if (!box || c.source !== "user") return;
  const isMe = c.author === shared.me;
  const ps = isMe ? {} : await names([c.author]);
  if (openId !== c.id) return;
  box.innerHTML = `<span class="maker"><span class="who"></span></span>
    ${isMe ? `<button class="btn small" type="button" id="editCourse">고치기</button>` : ""}
    ${isMe || shared.owner ? `<button class="btn small" type="button" id="deleteCourse">${isMe ? "지우기" : "관리: 지우기"}</button>` : ""}
    ${!isMe && shared.db && shared.db.report ? `<button class="btn small ghost" type="button" id="reportCourse">신고</button>` : ""}`;
  box.querySelector(".who").textContent = isMe ? "내가 만든 코스" : `${(ps[c.author] && ps[c.author].name) || "누군가"} 님이 만든 코스`;
  const edit = $("editCourse");
  if (edit) edit.addEventListener("click", () => openBuilder(c.id));
  const del = $("deleteCourse");

// 신고: 서로 다른 세 사람이 신고하면 서버가 숨긴다. 한 번 더 눌러야 보냄
async function reportItem(col, author, item, btn) {
  if (btn.dataset.sure !== "1") { btn.dataset.sure = "1"; btn.textContent = "신고할까요? 한 번 더"; return; }
  btn.disabled = true;
  try { await shared.db.report(col, author, item); btn.textContent = "신고했어요"; toast("신고했어요. 여러 명이 신고하면 숨겨져요"); }
  catch { btn.disabled = false; btn.textContent = "신고"; toast("신고하지 못했어요. 잠시 뒤에 다시 해 주세요"); }
}

function askDelete(c, btn) {
  // confirm() 대신 한 번 더 누르게 한다
  if (btn.dataset.sure !== "1") {
    btn.dataset.sure = "1";
    btn.textContent = "정말 지울까요? 한 번 더 누르기";
    return;
  }
  const courses = { ...(shared.courseDocs[c.author] || {}) };
  delete courses[c.id];
  writeDoc("uc/" + c.author, { courses }).then((ok) => {
    if (!ok) return;
    toast("코스를 지웠어요");
    closeCourse();
  });
}

/* ---------- 내 위치 ---------- */
function toggleNear() {
  const localMode = state.mode === "local" && browsing();
  if (state.here && !localMode) { state.here = null; update(); return; }
  if (!navigator.geolocation) { toast("이 브라우저는 위치를 지원하지 않아요"); return; }
  toast("위치를 찾는 중이에요");
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (localMode) {
        let best = null;
        for (const [region, hs] of Object.entries(LOCAL.hoods)) {
          for (const h of hs) {
            const d = km(here, h);
            if (!best || d < best.d) best = { region, h, d };
          }
        }
        if (best) {
          state.region = best.region;
          state.hood = best.h.id;
          save(STORE.hood, state.hood);
          update();
          toast(`가까운 동네: ${best.h.name}`);
        }
        return;
      }
      state.here = here;
      state.region = "";
      update();
      toast("가까운 코스부터 보여 드려요");
    },
    () => { toast("위치를 가져오지 못했어요. 권한을 확인해 주세요"); update(); },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 },
  );
}

/* ---------- 기타 ---------- */
let toastTimer = 0;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 1800);
}

function applyTheme(theme) {
  if (theme) document.documentElement.setAttribute("data-mode", theme);
  else document.documentElement.removeAttribute("data-mode");
  const dark = theme === "dark";
  $("themeBtn").innerHTML = icon(dark ? "sun" : "moon");
  $("themeBtn").setAttribute("aria-label", dark ? "밝게 보기" : "어둡게 보기");
}
function toggleTheme() {
  const dark = document.documentElement.getAttribute("data-mode") === "dark";
  const next = dark ? "light" : "dark";
  applyTheme(next);
  save(STORE.theme, next);
}

function courseFromHash() {
  const m = location.hash.match(/^#c=(.+)$/);
  return m ? decodeURIComponent(m[1]) : "";
}

$("tabHome").addEventListener("click", () => goTab(false, false));
$("modeTrip").addEventListener("click", () => setMode("trip"));
$("modeLocal").addEventListener("click", () => setMode("local"));
$("favBtn").addEventListener("click", () => goTab(true, false));
$("userOnlyBtn").addEventListener("click", () => goTab(false, true));
$("weekendBtn").addEventListener("click", () => openWeekend());
$("filterClose").innerHTML = icon("close");
["regionRow", "hoodRow", "quickRow"].forEach((id) => enableHScroll($(id)));
$("hoodClose").innerHTML = icon("close");
$("hoodClose").addEventListener("click", () => $("hoodSheet").close());
$("hoodSheet").addEventListener("click", (e) => { if (e.target === $("hoodSheet")) $("hoodSheet").close(); });
$("hoodSearchBox").insertAdjacentHTML("afterbegin", icon("search"));
$("hoodQ").addEventListener("input", renderHoodList);
$("filterClose").addEventListener("click", () => $("filterSheet").close());
$("filterApply").addEventListener("click", () => $("filterSheet").close());
$("filterReset").addEventListener("click", () => { state.who = ""; state.tags.clear(); state.budget = null; state.short = false; update(); });
$("filterSheet").addEventListener("click", (e) => { if (e.target === $("filterSheet")) $("filterSheet").close(); });
$("searchBox").insertAdjacentHTML("afterbegin", icon("search"));
$("brandMark").insertAdjacentHTML("afterbegin", icon("pin"));
$("randomGo").insertAdjacentHTML("afterbegin", icon("shuffle"));
$("makeBtn").addEventListener("click", () => openBuilder());
let qTimer = 0;
$("q").addEventListener("input", (e) => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = e.target.value.trim(); renderList(); renderWeekend(); }, 150);
});
$("sheet").addEventListener("close", () => {
  openId = "";
  if (courseFromHash()) history.pushState(null, "", location.pathname + location.search);
});
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeCourse(); });
window.addEventListener("popstate", () => {
  const id = courseFromHash();
  if (id) openCourse(id, { push: false }); else closeCourse();
});

(async () => {
  const [base, local] = await Promise.all([loadCourses(), loadLocal()]);
  state.base = base;
  state.local = local;
  state.mode = load(STORE.mode, "trip") === "local" && local.length ? "local" : "trip";
  if (state.mode === "local") {
    const saved = hoodById(load(STORE.hood, ""));
    if (saved) { state.hood = saved.id; state.region = Object.keys(LOCAL.hoods).find((r) => hoodsOf(r).includes(saved)); }
  }
  mergeCourses();
  if (favFromHash()) { state.favOnly = true; state.userOnly = false; }
  update();
  const id = courseFromHash();
  if (id && findCourse(id)) openCourse(id, { push: false });
  else if (id) pendingId = id;
  initShared().catch(() => {});
  loadEvents();
})();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
